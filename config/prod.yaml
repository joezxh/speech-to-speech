# Generated by the deployment parameter platform.
# Edit through the console: a manual change is overwritten on the next
# publish and will not appear in the version history.
schema_version: 1
blocks:
  vad:
    kind: vad
    backend: silero
    settings:
      min_silence_ms: 450
      smart_turn: false
      smart_turn_model_path: cache/smart-turn-v3.2-cpu.onnx
      speculative_reopen_ms: 0
      unanswered_reopen_ms: 0
  stt:
    kind: stt
    backend: qwen3-asr
    settings:
      qwen3_asr_model_name: {env: S2S_ASR_MODEL_DIR}
      qwen3_asr_device: cuda
      qwen3_asr_torch_dtype: bfloat16
      qwen3_asr_language: auto
      qwen3_asr_gen_max_new_tokens: 128
  llm:
    kind: llm
    backend: chat-completions
    settings:
      model_name: qwen3.8-27b
      responses_api_base_url: http://llm-uve484oav7pue2sw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      responses_api_api_key: {env: LLM_API_KEY}
      responses_api_stream: true
      responses_api_reasoning_effort: ''
      stream_batch_sentences: 1
      init_chat_role: system
      init_chat_prompt: 'You are a helpful voice assistant. Keep every reply very short: one or two spoken sentences unless the user asks for detail. Reply in the user''s language.'
  tts:
    kind: tts
    backend: qwen3
    settings:
      qwen3_tts_model_name: {env: S2S_TTS_MODEL_DIR}
      qwen3_tts_backend: torch
      qwen3_tts_device: cuda
      qwen3_tts_language: auto
      qwen3_tts_non_streaming_mode: false
      qwen3_tts_streaming_chunk_size: 4
pipelines:
  prod:
    stages:
      vad: vad
      stt: stt
      llm: llm
      tts: tts
    num_pipelines: 1
    options:
      enable_live_transcription: false
runtime:
  server:
    host: 0.0.0.0
    port: 8765
