# Rendered from the parameter platform; the file on disk is the live config.
# Migrated 1:1 from the 40+ CLI flags that used to sit in docker-compose.yml.
#
# File mode accepts only -f/--name (cli.py:_run_file_command), so anything not
# written here cannot be passed at run time.
#
# NOTE: edited for local Windows runs — model/cache paths point at the repo's
# `cache/` directory instead of the container's `/root/.cache`. The Silero VAD
# repo path is resolved in code (vad_handler.py) and falls back to the in-repo
# `silero-vad/` directory on Windows. Container deploys (docker-compose.*.yml)
# use CLI flags, NOT this file, so this change does not affect them.
#
# 独立服务（ASR / TTS / 声纹 / 情感）不在本文件声明：顶层键是严格白名单，
# 新增 services: 段会被 config.py:validate_config 判为 Unknown field。
# 它们的开关与端点配置全部来自 config/prod.env 的同名环境变量，由
# create_app() 在启动时挂载；本文件只保留权重路径的 {env: NAME} 联动。
# 参照部署：docker-compose.voiceprint.yml（声纹，方案 C）与
# D:/work/mediation_platform/mediation-deploy/ser（emotion2vec_plus_large，情感）。
schema_version: 1

blocks:
  vad:
    kind: vad
    # No --vad flag was ever passed, so this is the CLI default; stating it keeps
    # the file self-describing.
    backend: silero
    settings:
      # 每轮结束要等的尾部静音；STT 必须等它结束才开始，因此这段纯等待直接
      # 计入每一轮延迟。从 700→450→300ms，每轮再省约 150ms 纯等待。
      # 300ms 是 silero iterator 的默认下限；再低（<300）在说话停顿处容易
      # 误切分，故保留 300ms 不再下探。
      min_silence_ms: 300
      # --no_smart_turn: pure silence detection, no Smart Turn
      smart_turn: false
      # Kept even though smart_turn is off: a missing path makes the backend
      # download v3.2 at startup, which stalls an offline container.
      smart_turn_model_path: cache/smart-turn-v3.2-cpu.onnx
      speculative_reopen_ms: 0
      unanswered_reopen_ms: 0

  stt:
    kind: stt
    # Qwen3-ASR-1.7B：自回归多模态 ASR，准确率高于 SenseVoiceSmall/Large，
    # 代价是 RTF 0.47~0.90（自回归解码），比 CTC 非自回归慢一个数量级。
    backend: qwen3-asr
    settings:
      qwen3_asr_model_name: {env: S2S_ASR_MODEL_DIR}
      qwen3_asr_device: cuda
      qwen3_asr_language: auto
      qwen3_asr_gen_max_new_tokens: 256

  llm:
    kind: llm
    backend: chat-completions
    settings:
      # LLM 走内网 GPUStack 的 Qwen3-8B（与 config/prod.env 的 GPUSTACK_* 一致）。
      # 之前这里的 qwen3.8-27b（笔误）+ 百炼 maas 域名与 env 注释矛盾，实测每次
      # 响应约 6k output tokens，首包被长思考/长回复拖慢。GPUStack 关思考链后
      # 一次短回复实测 1.26s / 43 tokens。
      model_name: {env: GPUSTACK_MODEL}
      responses_api_base_url: {env: GPUSTACK_BASE_URL}
      # chat-completions 后端同样读这组 responses_api_* 字段；环境变量缺失是
      # resolve 期硬错误，没有默认值兜底。
      responses_api_api_key: {env: GPUSTACK_API_KEY}
      responses_api_stream: true
      # 空串 = 不发 reasoning_effort；chat-completions 会回退到
      # chat_template_kwargs.enable_thinking=false，关闭 Qwen3 思考链。
      responses_api_reasoning_effort: ""
      # 每攒 1 句就送 TTS，首音最快（默认 3 句会多等 1-2 句的生成时间）。
      stream_batch_sentences: 1
      init_chat_role: system
      # 中文提示词：整段 system prompt 的模板（LLM/voice_prompt.py）仍是英文，
      # 这里把会话人格部分换成中文，模型回答语言会随提示词一起偏回中文。
      init_chat_prompt: "你是一个语音助手。请始终用中文回答，回复要简短：一两句话即可，除非用户要求展开细节。"
      # 注入语言指令（"Please reply to my message in <language>."）。
      # 依赖 STT 产出 language_code —— sense-voice handler 已提供（按 SenseVoice
      # 实际听到的语种判定），否则这一段不会注入。
      enable_lang_prompt: true

  tts:
    kind: tts
    # 从 qwen3-tts-1.7b-customvoice 换成 VoxCPM2-2B：更高音质（48 kHz），
    # 扩散式语音生成，支持流式输出。
    backend: voxcpm
    settings:
      voxcpm_tts_model_name: {env: S2S_TTS_MODEL_DIR}
      voxcpm_tts_device: cuda
      voxcpm_tts_dtype: auto
      voxcpm_tts_streaming: true

pipelines:
  # `--name prod` in the compose command selects this definition and nothing
  # else: `serve` requires exactly one selected definition.
  prod:
    stages: {vad: vad, stt: stt, llm: llm, tts: tts}
    num_pipelines: 1
    options:
      # --no_enable_live_transcription. Lives here rather than in a block because
      # it is a ModuleArguments field, not a component setting.
      enable_live_transcription: false
      # STV 口型（ModuleArguments 字段，放 options）。打开后 pipeline 会挂载
      # Wav2Vec2STVHandler，并在 TTS 音频上产出 viseme 扩展事件。默认模型是
      # 英语音素 wav2vec2；本机 HF 不可达、ModelScope 无镜像，故 setup 会
      # soft-fail 为 skip（仅记日志，不影响音频链路），capability 标 not_ready。
      # 拿到模型后放入本地目录并把 stv_model_name 指过去即可自动启用。
      enable_visemes: true
      stv_model_name: {env: S2S_STV_MODEL_DIR}
      stv_device: cpu
      # 说话人分离：file 模式不接受 --with-diarization 命令行开关（cli.py 会
      # 直接 exit 2），只能经本 YAML 起停。置 true 后随 serve 启动嵌入式
      # DiarizationWorker。prod.env 的 HF_HUB_OFFLINE=1 下任何 repo id 都会因
      # 无缓存而启动失败，故权重已预取到本地目录（仅 safetensors+配置，
      # 经 hf-mirror 拉取）；删掉 model_name 行则回退默认 repo id（需联网）。
      diarization: true
      diarization_model_name: cache/nemotron3-diarization
      # 12GB 卡显存吃紧（服务独占 ~10.4GB 并已溢出到共享显存）：默认 fp32
      # 改 bf16 可省 ~0.5GB，对说话人分离精度几乎无感。取值限
      # float32/float16/bfloat16。
      diarization_dtype: bfloat16

runtime:
  server:
    # Deliberately widened: the catalog default is 127.0.0.1, unreachable from
    # outside the container.
    host: 0.0.0.0
    port: 8765

  # 嵌入式 LiveKit worker：随本服务启动/停止（共享 pipeline stop event），无需
  # 单独容器。密钥不进 YAML：启动前 fail-fast 校验的 LIVEKIT_URL / API_KEY /
  # API_SECRET 及 LIVEKIT_WORKER_ASR_MODE=local 均在 config/prod.env 声明；
  # local 模式要求 STT backend，本文件 stt 块已满足。
  livekit_worker:
    enabled: true

