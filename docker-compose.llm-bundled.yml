# 方案二（本机验证版）：LLM 一并本地部署，本地运行 Qwen3.5-4B(Q4)，完全自包含
#
# 本机适配说明（2026-10-22，RTX 5070 Ti Laptop 12GB）：
#   - 本机 ghcr.io 拉取被限速，故 LLM 直接复用主机已装的 llama.cpp（LM Studio 自带
#     llama-server.exe，CUDA 版）来服务本地已缓存的 ./cache/qwen35-4b/Qwen3.5-4B-Q4_K_M.gguf。
#   - pipeline 容器通过 host.docker.internal:8080 访问主机 llama-server（已在 extra_hosts 映射）。
#   - STT/TTS 对齐本地部署：Qwen3-ASR + Qwen3-TTS（权重已缓存），VAD 用本机优化参数。
#
# 启动步骤：
#   1) 先启动主机 llama-server（示例，CUDA 版路径按你 LM Studio 实际目录调整）：
#      & "C:\Users\joezxh\.lmstudio\extensions\backends\llama.cpp-win-x86_64-nvidia-cuda12-avx2-2.56.0\llama-server.exe" `
#        --model "D:\work\qwen-audio-agent\speech-to-speech-src\cache\qwen35-4b\Qwen3.5-4B-Q4_K_M.gguf" `
#        --alias Qwen3.5-4B-Instruct-GGUF --host 0.0.0.0 --port 8080 -c 8192 -np 1 --reasoning-budget 0
#   2) 启动 pipeline（本 compose，仅 pipeline 服务；llama 服务已注释掉）：
#      docker compose -f docker-compose.llm-bundled.yml up -d pipeline
#   3) 验证：
#      curl http://127.0.0.1:8080/v1/models
#      docker compose -f docker-compose.llm-bundled.yml logs -f pipeline
#
# 完全自包含（容器化 LLM，无需主机 llama-server）的替代方案——取消下面 llama 服务注释，
# 并把 pipeline 的 responses_api_base_url 改回 http://llama:8080/v1、恢复 depends_on: [llama] 即可：
#   llama:
#     image: ghcr.io/ggml-org/llama.cpp:server-cuda
#     command:
#       - -m
#       - /root/.cache/qwen35-4b/Qwen3.5-4B-Q4_K_M.gguf
#       - --alias
#       - Qwen3.5-4B-Instruct-GGUF
#       - -np
#       - "1"
#       - -c
#       - "8192"
#       - -fa
#       - "on"
#       - --reasoning-budget
#       - "0"
#       - --host
#       - 0.0.0.0
#       - --port
#       - "8080"
#     ports:
#       - 8080:8080/tcp
#     volumes:
#       - ./cache/:/root/.cache/
#     restart: unless-stopped
#     deploy:
#       resources:
#         reservations:
#           devices:
#             - driver: nvidia
#               device_ids: ['0']
#               capabilities: [gpu]

services:
  pipeline:
    image: ccr.ccs.tencentyun.com/llm-basic/speech-to-speech:cu130-1.0
    command:
      - speech-to-speech
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      # —— LLM 指向主机 llama-server（OpenAI 兼容，chat-completions 后端）——
      - --llm_backend
      - chat-completions
      - --model_name
      - Qwen3.5-4B-Instruct-GGUF
      - --responses_api_base_url
      - http://host.docker.internal:8080/v1
      - --responses_api_api_key
      - ""
      - --responses_api_stream
      - --responses_api_reasoning_effort
      - none
      - --stream_batch_sentences
      - "1"
      - --chat_size
      - "20"
      # —— STT:Qwen3-ASR（本地 ./cache/qwen3-asr-model-hf，与本地部署一致）——
      - --stt
      - qwen3-asr
      - --qwen3_asr_model_name
      - /root/.cache/qwen3-asr-model-hf
      - --qwen3_asr_device
      - auto
      - --qwen3_asr_language
      - auto
      # —— TTS:Qwen3-TTS（torch / cuda / 句内流式，与本地部署一致）——
      - --tts
      - qwen3
      - --qwen3_tts_model_name
      - /root/.cache/qwen3-tts-model
      - --qwen3_tts_backend
      - torch
      - --qwen3_tts_device
      - cuda
      - --qwen3_tts_non_streaming_mode
      - "False"
      - --qwen3_tts_streaming_chunk_size
      - "4"
      - --qwen3_tts_speaker
      - Aiden
      - --qwen3_tts_language
      - auto
      # —— VAD 判停:关闭 Smart Turn 去除二次确认;缩短尾静音加速断句;适配环境噪声 ——
      - --min_silence_ms
      - "64"
      - --thresh
      - "0.6"
      - --no_smart_turn
      - --speculative_reopen_ms
      - "0"
      - --unanswered_reopen_ms
      - "0"
      - --init_chat_role
      - system
      - --init_chat_prompt
      - "You are a helpful voice assistant. Keep every reply very short: one or two spoken sentences unless the user asks for detail. Reply in the user's language."
      - --enable_live_transcription
    ports:
      - "${PIPELINE_PORT:-8765}:8765/tcp"
    volumes:
      - ./cache/:/root/.cache/
      - ./silero-vad:/opt/silero-vad:ro
    environment:
      - HF_HUB_OFFLINE=1
      - HF_ENDPOINT=https://hf-mirror.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
