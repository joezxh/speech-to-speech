# speech-to-speech 本地部署（LLM 走第三方服务，其余组件对齐 192.168.40.30 环境）
#
# ── 与现有环境的对应关系 ─────────────────────────────────────────────────────
#   基准：docker-compose.gpustack.yml（生产部署，LLM 由局域网 GPUStack 192.168.40.30 提供）
#   本文件：**只把 LLM 换成第三方 OpenAI 兼容服务**，其余组件逐项保持一致：
#     · STT   Qwen3-ASR-1.7B-hf（./cache/qwen3-asr-model-hf，language=auto，device=auto）
#     · TTS   Qwen3-TTS CustomVoice（./cache/qwen3-tts-model，torch 后端 / cuda / 句内流式 chunk=4）
#     · VAD   silero-vad（./silero-vad → /opt/silero-vad，min_silence_ms=700，thresh=0.6）
#     · 判停  关闭 Smart Turn + speculative reopen（避免重复气泡与首音延迟）
#     · 字幕  关闭 live transcription（同一句只保留一条最终转写）
#     · 编排  stream_batch_sentences=1（LLM 出首句即送 TTS，压 TTFA）
#     · 初始化 system 角色 + 简短口语化 prompt
#   差异仅两处（均为部署性差异，不影响组件配置）：
#     1) LLM 走第三方：base_url / model / api_key 全部来自 .env.thirdparty
#     2) 镜像基座换成本地镜像 speech-to-speech-local:cu130-1.2-rest
#        （生产基座 Dockerfile.ttsfix 已固化 ASR/TTS REST 端点补丁，本地基座原本缺失，
#          故由 Dockerfile.local.rest 补齐，见该文件说明）
#
# ── 对外接口（本机 127.0.0.1:${PIPELINE_PORT}，默认 8765）──────────────────────
#   WS   /v1/realtime              完整 S2S 会话（OpenAI Realtime 协议）
#   POST /v1/audio/transcriptions  ASR 独立接口（OpenAI 兼容，可脱离 S2S 单独调用）
#   POST /v1/audio/speech          TTS 独立接口（OpenAI 兼容，可脱离 S2S 单独调用）
#
# ── 用法 ────────────────────────────────────────────────────────────────────
#   1) 编辑 .env.thirdparty，填入第三方 LLM 的 base_url / model / api_key
#   2) docker compose -f docker-compose.thirdparty.yml --env-file .env.thirdparty up -d
#   3) docker compose -f docker-compose.thirdparty.yml --env-file .env.thirdparty logs -f pipeline
#
#   首次使用需先构建镜像（已含 ASR/TTS 独立端点补丁）：
#     docker build -f Dockerfile.local.rest -t speech-to-speech-local:cu130-1.2-rest .
#
#   调用说明见 docs/local-thirdparty-deployment-CN.md

name: speech-to-speech-thirdparty

services:
  pipeline:
    image: speech-to-speech-local:cu130-1.2-rest
    command:
      - speech-to-speech
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      # —— LLM：第三方 OpenAI 兼容服务（唯一的第三方依赖项）——
      - --llm_backend
      - chat-completions
      - --model_name
      - "${LLM_MODEL}"
      - --responses_api_base_url
      - "${LLM_BASE_URL}"
      - --responses_api_api_key
      - "${LLM_API_KEY}"
      - --responses_api_stream
      # 关思考：非官方 OpenAI 端点会附带 chat_template_kwargs.enable_thinking=false；
      # 若第三方认 "reasoning_effort=none" 语义，可改用下面两行（删除 disable_thinking 行）：
      #   - --responses_api_reasoning_effort
      #   - "none"
      - --responses_api_disable_thinking
      # 上游 LLM 不可用（5xx / 连接失败）时播报这句，与"模型答不出"的通用兜底区分；
      # 同时容器日志会记录 upstream_status 与 upstream_body，便于定位真实原因。
      - --responses_api_provider_unavailable_message
      - "语言模型服务暂时不可用，请稍后再试。"
      # 首句即送 TTS：默认要凑够 3 句才把文本喂给 TTS（首音被拖慢 ~4-5s）；
      # 1 = 句-by-句流式，LLM 一出首句 TTS 立刻开始合成 ★TTFA 关键★
      - --stream_batch_sentences
      - "1"
      # —— STT：Qwen3-ASR-1.7B-hf（与 192.168.40.30 环境一致）——
      # 权重在 ./cache/qwen3-asr-model-hf（容器内路径），本地路径离线加载。
      # ★必须用 -hf 版：handler 走 transformers 的 processor.apply_transcription_request()，
      #   它需要 -hf 权重自带的 chat_template.jinja。
      # language=auto：自动语种识别；device=auto：容器内单卡走 cuda。
      - --stt
      - qwen3-asr
      - --qwen3_asr_model_name
      - /root/.cache/qwen3-asr-model-hf
      - --qwen3_asr_device
      - auto
      - --qwen3_asr_language
      - auto
      # —— TTS：Qwen3-TTS（torch 后端 / cuda / 句内流式，与 192.168.40.30 环境一致）——
      # 权重在 ./cache/qwen3-tts-model（容器内路径），本地路径离线加载。
      - --tts
      - qwen3
      - --qwen3_tts_model_name
      - /root/.cache/qwen3-tts-model
      - --qwen3_tts_backend
      - torch
      - --qwen3_tts_device
      - cuda
      - --qwen3_tts_non_streaming_mode
      - "False"
      - --qwen3_tts_streaming_chunk_size
      - "4"
      # —— VAD 判停：关闭 Smart Turn + speculative 重开，退回纯静音判停 ★根治重复+卡顿★
      # 等 700ms 真静音即提交一轮、只转写+处理一次，一句一气泡、不重复。
      - --min_silence_ms
      - "${MIN_SILENCE_MS:-700}"
      - --thresh
      - "${VAD_THRESH:-0.6}"
      - --no_smart_turn
      - --speculative_reopen_ms
      - "0"
      - --unanswered_reopen_ms
      - "0"
      - --init_chat_role
      - system
      - --init_chat_prompt
      - "You are a helpful voice assistant. Keep every reply very short: one or two spoken sentences unless the user asks for detail. Reply in the user's language."
      # 关闭渐进式(live)转写：speculative 反复重开会按 revision 各发 partial，
      # 后端按不同 item_id/turnId 建成多条 → 同一句重复。关掉后只留经去重的最终转写。
      - --no_enable_live_transcription
      - --smart_turn_model_path
      - /root/.cache/smart-turn-v3.2-cpu.onnx
    ports:
      # ── 暴露 ASR / TTS 模型（OpenAI 兼容 REST 端点，均在 pipeline :8765）──
      #   ASR: POST /v1/audio/transcriptions   (模型: Qwen3-ASR-1.7B-hf)
      #   TTS: POST /v1/audio/speech           (模型: Qwen3-TTS CustomVoice)
      # 已固化进镜像：构建期由 Dockerfile.local.rest 应用 scripts/patch_pipeline_rest.py 注入，
      # 无需运行时手动打补丁，容器重建/镜像重做后 ASR/TTS 接口依然存在。
      - "${PIPELINE_PORT:-8765}:8765/tcp"
    environment:
      # Smart Turn / Qwen3-TTS 等模型已缓存在 ./cache，离线加载避免联网卡死
      - HF_HUB_OFFLINE=1
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_ENABLE_PROGRESS_BARS=false
      - MODELSCOPE_ENDPOINT=https://modelscope.cn
    volumes:
      - ./cache/:/root/.cache/
      # 注意:nltk_data 已烤进镜像（Dockerfile.local）。不要在此挂载 nltk_data:
      #   Windows 挂载点权限为 777,nltk 会拒绝授权该目录并转去联网重下,导致启动卡死。
      - ./silero-vad:/opt/silero-vad:ro
    extra_hosts:
      # 容器 → 宿主机。第三方 LLM 为公网地址时容器可直连，无需经此中转；
      # 若第三方为内网地址且容器直连不通，可把 LLM_BASE_URL 指向宿主上的反向代理。
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 预留给 STT+TTS 的 GPU（本机单卡 → GPU0）
              device_ids: ['${PIPELINE_GPU_ID:-0}']
              capabilities: [gpu]
