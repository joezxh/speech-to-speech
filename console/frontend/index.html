<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 声明了图标浏览器就不再默认请求 /favicon.ico（mount_spa 对不存在的文件一律 404）。 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>S2S 部署参数控制台</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- 图标精灵：组件里的 <use href="#i-…"> 全部指向这里。
         几何来自 demo/index.html:58-129，实心件用 fill、描边件用 stroke。 -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display: none">
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" />
        <path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24">
        <path
          d="M2 2l20 20M9 5a3 3 0 0 1 6 0v4M9 10v1a3 3 0 0 0 5.1 2.1M19 10a7 7 0 0 1-1.24 3.97M5 10a7 7 0 0 0 11 5.67M12 19v3M8 22h8"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-stop" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" />
      </symbol>
      <symbol id="i-voice" viewBox="0 0 24 24">
        <path d="M3 10v4a1 1 0 0 0 1 1h3l5 4V5L7 9H4a1 1 0 0 0-1 1z" fill="currentColor" />
        <path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 16v-4M12 8v.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </symbol>
      <symbol id="i-wrench" viewBox="0 0 24 24">
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c0 .66.39 1.25 1 1.51H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        />
      </symbol>
      <!-- 侧栏图标（console 面 / voice 面）：几何与 console-preview.html 的导航一致。
           折叠成 56px 后侧栏只剩这一枚，所以每项都要有。 -->
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 6h5M15 6h5M4 12h9M19 12h1M4 18h3M13 18h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="12" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="16" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="10" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2" />
      </symbol>
      <symbol id="i-wave" viewBox="0 0 24 24">
        <path d="M4 12h2l2-6 2.5 12L13 6l2 6h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-history" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-server" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
        <rect x="3" y="13" width="18" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M7 7.5h.01M7 16.5h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </symbol>
      <!-- 以下三枚几何直接复制 demo `console-refactor-demo.html` 的 symbol（含 1.8 描边），
           集群总览 / 流量与路由 / 机器实际部署的前置图标与 demo 完全一致。 -->
      <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 2 7l10 5 10-5-10-5Z" />
        <path d="m2 17 10 5 10-5" />
        <path d="m2 12 10 5 10-5" />
      </symbol>
      <symbol id="i-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 20v-4M10 20V10M16 20V6M22 20v-9" />
      </symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="6" y="6" width="12" height="12" rx="2" />
        <rect x="9.5" y="9.5" width="5" height="5" rx="1" />
        <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-target" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2" />
      </symbol>
      <symbol id="i-trend" viewBox="0 0 24 24">
        <path d="M3 3v18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M7 14l4-4 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
    </svg>

    <script src="/vendor/openai-realtime-agents.umd.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
