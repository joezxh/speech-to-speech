<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S2S Console Refactor Prototype · Load Balancing as the Backbone</title>
<!--
  Static prototype (mock data, no backend). Information architecture:
  · Backbone: Load Balancing = unified entry & cluster foundation (overview / traffic & routing)
  · Voice front office: conversation, session history, tools, settings (routed through the LB)
  · Ops console (cluster scope): machines / deployments & params / voice library / releases / audit
  UI language defaults to English; the topbar toggles Chinese (remembered in localStorage).
  Every string is rendered through t(key) — no hard-coded copy in templates.
  Design tokens mirror console/design/console-preview.html and frontend/src/styles/variables.less.
-->
<style>
  :root {
    --bg: #0b1020; --surface: #141a2e; --surface-2: #1a2138; --surface-3: #212a45;
    --border: #232b45; --border-strong: #2e3856;
    --text: #e6e8f0; --muted: #8b93a7; --faint: #5b6478;
    --accent: #5b8cff; --accent-soft: rgba(91, 140, 255, 0.16);
    --success: #35c48a; --warning: #e8b339; --danger: #f0655c;
    --purple: #a78bfa; --orange: #f0a05c; --cyan: #22d3ee;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace;
    --voice-bg: #0a0b10; --voice-surface: #13151c; --voice-surface-2: #1b1e29;
    --voice-border: rgba(255, 255, 255, 0.08); --voice-text: #f5f6fa;
    --voice-dim: rgba(245, 246, 250, 0.65); --voice-faint: rgba(245, 246, 250, 0.42);
    --voice-accent: #8b7dff; --voice-listening: #22d3ee; --voice-speaking: #8b7dff;
    --voice-ready: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* sidebar */
  .sidebar { width: 236px; flex: 0 0 236px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .brand { padding: 18px 16px 12px; display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--purple)); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
  .brand-name { font-weight: 650; letter-spacing: .02em; }
  .brand-sub { font-size: 11px; color: var(--muted); }
  .nav-group { padding: 10px 8px 4px; }
  .nav-title { font-size: 11px; color: var(--faint); letter-spacing: .12em; padding: 6px 10px 4px; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); color: var(--muted); cursor: pointer; user-select: none; }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }
  .nav-item svg { width: 17px; height: 17px; flex: 0 0 17px; }
  .side-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); line-height: 1.7; white-space: pre-line; }

  /* main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 56px; flex: 0 0 56px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 20px; }
  .crumb { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
  .crumb b { color: var(--text); font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--muted); font-size: 12px; cursor: default; }
  .pill select { background: transparent; border: 0; color: var(--text); font: inherit; outline: none; cursor: pointer; }
  .pill select option { color: #111; }
  #lang-btn { cursor: pointer; color: var(--text); font-weight: 600; }
  #lang-btn:hover { border-color: var(--accent); color: var(--accent); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 12px; color: var(--accent); border: 1px solid var(--border-strong); }
  .content { flex: 1; overflow-y: auto; padding: 22px 26px 60px; }
  .page-head { margin: 0 0 18px; }
  .page-head h1 { margin: 0 0 6px; font-size: 20px; }
  .page-head p { margin: 0; color: var(--muted); font-size: 13px; }

  /* shared components */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 .hint { font-weight: 400; font-size: 12px; color: var(--faint); }
  .grid { display: grid; gap: 14px; }
  .g4 { grid-template-columns: repeat(4, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1100px) { .g4, .g3 { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 24px; font-weight: 680; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 11px; color: var(--faint); margin-top: 4px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; color: var(--faint); font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr.clickable { cursor: pointer; }
  .tbl tbody tr.clickable:hover td { background: var(--surface-2); }
  .tbl tbody tr.selected td { background: var(--accent-soft); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: var(--success); } .dot.warn { background: var(--warning); } .dot.bad { background: var(--danger); } .dot.draining { background: var(--orange); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--muted); }
  .tag.ok { color: var(--success); border-color: rgba(53,196,138,.4); background: rgba(53,196,138,.1); }
  .tag.warn { color: var(--warning); border-color: rgba(232,179,57,.4); background: rgba(232,179,57,.1); }
  .tag.bad { color: var(--danger); border-color: rgba(240,101,92,.4); background: rgba(240,101,92,.1); }
  .tag.accent { color: var(--accent); border-color: rgba(91,140,255,.4); background: var(--accent-soft); }
  .tag.orange { color: var(--orange); border-color: rgba(240,160,92,.4); background: rgba(240,160,92,.1); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); }
  .note { font-size: 12px; color: var(--warning); background: rgba(232,179,57,.08); border: 1px solid rgba(232,179,57,.35); border-radius: var(--radius-sm); padding: 8px 12px; margin: 0 0 14px; }
  .rowline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spacer { flex: 1; }

  /* deploy module — parameter table aligned with docs/parameter-catalog.md */
  .tscroll { overflow-x: auto; }
  .tbl.ptbl { min-width: 1500px; table-layout: fixed; }
  .ptbl th { font-size: 11px; }
  .ptbl td { font-size: 12.5px; vertical-align: top; }
  .ptbl .c-param { width: 236px; }
  .ptbl .c-def { width: 130px; }
  .ptbl .c-src { width: 118px; }
  .ptbl .c-eff { width: 98px; }
  .ptbl .c-exp { width: 96px; }
  .ptbl .c-imp { width: 110px; }
  .ptbl .c-act { width: 132px; }
  .ptbl .c-exp2 { width: 138px; }
  .ptbl .c-risk { width: 250px; }
  .ptbl .c-anc { width: 150px; }
  .ptbl .p-what { color: var(--muted); font-size: 11.5px; margin-top: 3px; line-height: 1.45; }
  .ptbl .p-risk { color: var(--faint); font-size: 11.5px; line-height: 1.45; }
  .ptbl tr.ghead td { background: var(--surface-3); color: var(--text); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px; }
  .ptbl tr.shead td { color: var(--faint); font-size: 11px; letter-spacing: .08em; padding: 11px 10px 4px; }
  .ptbl tr.shead span.sec { font-family: var(--mono); letter-spacing: 0; }
  .ptbl tr.drift td { background: rgba(232, 179, 57, .07); }
  .ptbl tr.ro td { background: rgba(139, 147, 167, .04); }
  .ptbl tr.opsrow td { background: rgba(240, 101, 92, .06); }
  .ptbl tr.draft td { box-shadow: inset 3px 0 0 var(--accent); }
  /* keep the row identity and the push/rollback rail visible while the wide table scrolls */
  .ptbl th.c-param, .ptbl tbody td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface-2); }
  .ptbl th.c-act, .ptbl tbody td:last-child { position: sticky; right: 0; z-index: 1; background: var(--surface-2); border-left: 1px solid var(--border); }
  .ptbl tr.shead td, .ptbl tr.ghead td { position: static; background: transparent; border-left: 0; }
  .ptbl .dsec { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .ptbl .dprod { font-size: 11px; color: var(--faint); margin-top: 2px; }
  input.pv, select.pv { width: 100%; box-sizing: border-box; background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 5px; font-family: var(--mono); font-size: 12px; padding: 3px 6px; }
  input.pv.isdrift, select.pv.isdrift { border-color: rgba(232, 179, 57, .55); color: var(--warning); font-weight: 600; }
  .runsrc { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .rec { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius-md); background: var(--surface-2); padding: 10px 13px; margin-bottom: 10px; }
  .rec.hot { border-left-color: var(--cyan); }
  .rec.restart { border-left-color: var(--warning); }
  .rec.container { border-left-color: var(--orange); }
  .rec-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rec-top .rname { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .rec-top .rsec { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .rec-top .rnow { font-size: 11.5px; color: var(--muted); }
  .rec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; margin-top: 9px; }
  .rec-grid > div { min-width: 0; }
  .rec-grid .k { font-size: 10.5px; color: var(--faint); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 3px; }
  .rec-grid .v { font-size: 12px; color: var(--muted); line-height: 1.55; }
  .rec-risk { font-size: 11.5px; color: var(--warning); margin-top: 8px; }
  .rec-ref { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 5px; }
  .chip.warn { border-color: rgba(240, 101, 92, .45); color: var(--danger); }
  .chip.warn.active { background: rgba(240, 101, 92, .14); border-color: var(--danger); color: var(--danger); }
  .draftbar { border: 1px dashed var(--accent); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12.5px; color: var(--accent); background: var(--accent-soft); margin-bottom: 12px; }
  .bebar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .bebar .be { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 6px; }
  .bebar .be.cur { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  details.be-fold { margin: 4px 0 2px; }
  details.be-fold summary { cursor: pointer; font-size: 11.5px; color: var(--muted); padding: 4px 0; list-style: none; }
  details.be-fold summary::-webkit-details-marker { display: none; }
  details.be-fold summary::before { content: '\203A '; color: var(--faint); }
  details.be-fold[open] summary::before { content: '\203C '; }
  details.be-fold table { margin-top: 6px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; line-height: 16px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .badge.start { color: var(--muted); }
  .badge.hot { color: var(--cyan); border-color: rgba(34, 211, 238, .45); background: rgba(34, 211, 238, .1); font-weight: 600; }
  .badge.both { color: var(--success); border-color: rgba(53, 196, 138, .4); background: rgba(53, 196, 138, .1); }
  .badge.container { color: var(--orange); border-color: rgba(240, 160, 92, .4); background: rgba(240, 160, 92, .1); }
  .badge.fixed { color: var(--faint); border-style: dashed; }
  .badge.exp.basic { color: var(--muted); }
  .badge.exp.advanced { color: var(--accent); border-color: rgba(91, 140, 255, .35); }
  .badge.exp.expert { color: var(--orange); border-color: rgba(240, 160, 92, .4); }
  .badge.exp.ops { color: var(--danger); border-color: rgba(240, 101, 92, .45); background: rgba(240, 101, 92, .1); font-weight: 600; }
  .badge.risk { margin-left: 4px; font-size: 10px; }
  .badge.ro { color: var(--faint); border-style: dashed; }
  .badge.draft { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .badge.equal { color: var(--success); border-color: rgba(53, 196, 138, .4); }
  .badge.diff { color: var(--warning); border-color: rgba(232, 179, 57, .5); background: rgba(232, 179, 57, .12); font-weight: 600; }
  .ptbl:not(.show-ops) tr.opsrow { display: none; }
  .chip.warn { border-color: rgba(240, 101, 92, .4); color: var(--danger); }
  .chip.warn.active { background: rgba(240, 101, 92, .16); border-color: var(--danger); color: var(--danger); }
  .scenebar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  /* machines: multi-workload services + token analytics (LB) */
  .tbl.mtbl { min-width: 1320px; }
  .mtbl td { font-size: 12.5px; }
  .mtbl tr.svcrow td { background: var(--surface-2); padding: 12px 14px 14px; border-bottom: 1px solid var(--border-strong); }
  .svclist { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .svc-sum { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 0 9px; }
  .wls { display: flex; gap: 4px; flex-wrap: wrap; }
  .svcbox { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); padding: 4px 12px; }
  .svcbox .svcitem { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .svcbox .svcitem:last-child { border-bottom: 0; }
  .svcbox label.cbr { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text); margin: 0; cursor: pointer; }
  .svcbox label.cbr input { accent-color: var(--accent); width: auto; }
  .svcgrid { display: grid; grid-template-columns: 1.3fr 1.4fr .7fr .6fr; gap: 8px; margin-top: 9px; }
  .svcgrid .k { font-size: 10.5px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
  @media (max-width: 900px) { .svcgrid { grid-template-columns: repeat(2, 1fr); } }
  .split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-3); margin: 4px 0 8px; }
  .split > i { display: block; height: 100%; }
  .split > i.p { background: linear-gradient(90deg, var(--accent), var(--purple)); }
  .split > i.c { background: var(--cyan); }
  .trend { width: 100%; height: auto; display: block; }
  .trend text { font-family: var(--font); fill: var(--muted); }
  .trend .t-sm { font-size: 9.5px; fill: var(--faint); }
  .trend .t-md { font-size: 11px; }
  .trend .grid-line { stroke: var(--surface-3); stroke-width: 1; }
  .trend .area { fill: rgba(91,140,255,.16); }
  .trend .line { fill: none; stroke: var(--accent); stroke-width: 1.8; }
  .trend .now-dot { fill: var(--cyan); }
  .tag.wl-pipeline { color: var(--accent); border-color: rgba(91,140,255,.4); background: var(--accent-soft); }
  .tag.wl-llm { color: var(--cyan); border-color: rgba(34,211,238,.4); background: rgba(34,211,238,.1); }
  .tag.wl-video { color: var(--orange); border-color: rgba(240,160,92,.4); background: rgba(240,160,92,.1); }
  .tag.wl-jepa { color: var(--purple); border-color: rgba(167,139,250,.4); background: rgba(167,139,250,.1); }
  .tag.wl-embed { color: var(--success); border-color: rgba(53,196,138,.4); background: rgba(53,196,138,.1); }

  /* voice creation wizard (音色库) */
  .vsources { display: flex; flex-direction: column; gap: 6px; }
  .vsrc { text-align: left; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text); padding: 9px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .vsrc small { display: block; font-size: 11.5px; color: var(--faint); margin-top: 3px; font-weight: 400; }
  .vsrc.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .vsrc.on small { color: var(--muted); }
  .wave { width: 100%; height: 76px; display: block; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .wave .bar-in { fill: var(--accent); }
  .wave .bar-out { fill: var(--faint); opacity: .45; }
  .wave .win { fill: rgba(91,140,255,.10); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; }
  .wave text { font-family: var(--mono); font-size: 9.5px; fill: var(--faint); }
  .tag.src-builtin { color: var(--muted); }
  .tag.src-clone { color: var(--cyan); border-color: rgba(34,211,238,.4); background: rgba(34,211,238,.1); }
  .tag.src-design { color: var(--purple); border-color: rgba(167,139,250,.4); background: rgba(167,139,250,.1); }
  select.pv { max-width: 240px; min-width: 0; }

  /* topology */
  .topo { width: 100%; height: auto; display: block; }
  .topo text { font-family: var(--font); fill: var(--text); }
  .topo .t-sm { font-size: 9.5px; fill: var(--muted); }
  .topo .t-md { font-size: 11.5px; }
  .topo .t-lg { font-size: 13px; font-weight: 600; }
  .topo .lb-box { fill: rgba(91,140,255,.14); stroke: var(--accent); stroke-width: 1.4; }
  .topo .mx-box { fill: var(--surface-2); stroke: var(--border-strong); }
  .topo .it-ok { fill: rgba(53,196,138,.12); stroke: var(--success); stroke-width: 1; }
  .topo .it-warn { fill: rgba(232,179,57,.14); stroke: var(--warning); stroke-width: 1; }
  .topo .it-bad { fill: rgba(240,101,92,.12); stroke: var(--danger); stroke-width: 1; }
  .topo .edge { stroke: var(--border-strong); stroke-width: 1.2; fill: none; }
  .topo .edge.flow { stroke: var(--accent); stroke-dasharray: 5 5; animation: dash 1.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -20; } }

  /* release pipeline */
  .pipe { display: flex; align-items: flex-start; margin: 6px 0 4px; }
  .stage { flex: 1; text-align: center; position: relative; }
  .stage .node { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; font-size: 12px; border: 2px solid var(--border-strong); background: var(--surface-2); color: var(--faint); position: relative; z-index: 1; }
  .stage::before { content: ''; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--border-strong); }
  .stage:first-child::before { display: none; }
  .stage.done .node { border-color: var(--success); background: rgba(53,196,138,.15); color: var(--success); }
  .stage.done::before, .stage.current::before { background: var(--success); }
  .stage.current .node { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  .stage .s-label { font-size: 12.5px; } .stage .s-sub { font-size: 11px; color: var(--faint); }
  .stage.pending .s-label { color: var(--faint); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(91,140,255,.12); } }

  /* conversation page */
  .voice-grid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
  @media (max-width: 1100px) { .voice-grid { grid-template-columns: 1fr; } }
  .v-card { background: var(--voice-surface); border: 1px solid var(--voice-border); border-radius: var(--radius-lg); padding: 18px; color: var(--voice-text); }
  .v-stage { text-align: center; padding: 26px 18px 20px; }
  .orb { width: 128px; height: 128px; border-radius: 50%; margin: 0 auto 16px; background: radial-gradient(circle at 35% 30%, #2a3350, #12141d 70%); box-shadow: 0 0 0 1px var(--voice-border), 0 0 46px rgba(139,125,255,.18); transition: .4s; }
  .orb.state-listening { background: radial-gradient(circle at 35% 30%, #164b57, #0d1520 72%); box-shadow: 0 0 0 1px rgba(34,211,238,.35), 0 0 60px rgba(34,211,238,.4); animation: breathe 1.8s ease-in-out infinite; }
  .orb.state-thinking { background: radial-gradient(circle at 35% 30%, #4a3a1c, #14101c 72%); box-shadow: 0 0 0 1px rgba(232,179,57,.35), 0 0 56px rgba(232,179,57,.35); animation: breathe 1.4s ease-in-out infinite; }
  .orb.state-speaking { background: radial-gradient(circle at 35% 30%, #3b3170, #14122a 72%); box-shadow: 0 0 0 1px rgba(139,125,255,.4), 0 0 60px rgba(139,125,255,.45); animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  .v-state { font-size: 13px; color: var(--voice-dim); letter-spacing: .08em; }
  .v-state b { color: var(--voice-text); }
  .transcript { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; max-height: 300px; overflow-y: auto; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; }
  .bubble.user { align-self: flex-end; background: rgba(139,125,255,.22); border: 1px solid rgba(139,125,255,.35); }
  .bubble.assistant { align-self: flex-start; background: var(--voice-surface-2); border: 1px solid var(--voice-border); }
  .bubble.meta { align-self: center; font-size: 11.5px; color: var(--voice-faint); background: transparent; border: 0; }
  .v-controls { margin-top: 18px; display: flex; justify-content: center; gap: 12px; }
  .v-panel h4 { margin: 0 0 10px; font-size: 12px; color: var(--voice-faint); letter-spacing: .1em; text-transform: uppercase; }
  .v-panel .section { margin-bottom: 18px; }
  .v-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; color: var(--voice-dim); gap: 10px; }
  .v-row select, .v-row input[type=range] { background: var(--voice-surface-2); color: var(--voice-text); border: 1px solid var(--voice-border); border-radius: 6px; font: inherit; padding: 3px 6px; max-width: 150px; }
  .switch { width: 36px; height: 20px; border-radius: 10px; background: var(--voice-surface-2); border: 1px solid var(--voice-border); position: relative; cursor: pointer; transition: .2s; flex: 0 0 36px; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--voice-dim); transition: .2s; }
  .switch.on { background: rgba(139,125,255,.35); border-color: var(--voice-accent); }
  .switch.on::after { left: 18px; background: var(--voice-accent); }
  #page-conversation { background: var(--voice-bg); margin: -22px -26px -60px; padding: 22px 26px; min-height: calc(100% + 82px); }

  /* drawers */
  .overlay { position: fixed; inset: 0; background: rgba(5,8,18,.6); backdrop-filter: blur(3px); display: none; z-index: 40; }
  .overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 430px; max-width: 92vw; background: var(--surface); border-left: 1px solid var(--border-strong); z-index: 50; transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .drawer-head h3 { margin: 0; font-size: 15px; }
  .drawer-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
  .x-btn { border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .hist-item { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; background: var(--surface-2); }
  .hist-item .h-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .hist-item .h-excerpt { font-size: 13px; line-height: 1.5; }
  .tool-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; gap: 12px; }
  .tool-row .t-name { font-weight: 600; font-size: 13px; } .tool-row .t-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 14px; }
  .set-row .s-sub { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .set-row input[type=text], .set-row select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; font: inherit; padding: 5px 8px; max-width: 210px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text); padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .icon-sprite { display: none; }

  /* modal (cluster / machine CRUD) */
  .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%) scale(.98); width: 540px; max-width: 94vw; max-height: 86vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; z-index: 55; opacity: 0; pointer-events: none; transition: .18s ease; box-shadow: 0 18px 60px rgba(0,0,0,.45); }
  .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .modal-head { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-body { padding: 10px 20px 20px; }
  .field { margin: 12px 0; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .fin { width: 100%; box-sizing: border-box; background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; font: inherit; padding: 7px 10px; font-size: 13px; }
  .fin:disabled { opacity: .55; cursor: not-allowed; }
  .fhint { font-size: 11.5px; color: var(--faint); margin-top: 5px; }
  .ferr { display: none; margin-top: 10px; padding: 8px 12px; border-radius: 6px; background: rgba(240,101,92,.12); border: 1px solid rgba(240,101,92,.4); color: var(--danger); font-size: 12.5px; }
  .test-steps { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 4px 14px; background: var(--surface-2); }
  .tstep { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
  .tstep:last-child { border-bottom: 0; }
  .tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: 0 0 9px; }
  .tstep.running .tdot { background: var(--warning); animation: tpulse 1s infinite; }
  .tstep.ok .tdot { background: var(--success); }
  .tstep.fail .tdot { background: var(--danger); }
  .tstat { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; }
  .tstep.running .tstat { color: var(--warning); }
  .tstep.ok .tstat { color: var(--success); }
  .tstep.fail .tstat { color: var(--danger); }
  @keyframes tpulse { 50% { opacity: .3; } }
  .test-note-ok { margin-top: 12px; padding: 9px 12px; border-radius: 6px; background: rgba(53,196,138,.12); border: 1px solid rgba(53,196,138,.4); color: var(--success); font-size: 12.5px; }
  .test-note-bad { margin-top: 12px; padding: 9px 12px; border-radius: 6px; background: rgba(240,101,92,.12); border: 1px solid rgba(240,101,92,.4); color: var(--danger); font-size: 12.5px; }

/* ───────── config drift (mock) ─────────
   What the running process on each machine reports, listed only where it differs from the expected baseline.
   key = "group:param"; an absent key means actual equals expected; machines with state 'bad' report nothing. */
const DRIFT = {
  'node-a01': { 'vad:min_silence_ms': '300', 'vad:smart_turn': 'true', 'stt:qwen3_asr_gen_max_new_tokens': '256',
    'llm:stream_batch_sentences': '3', 'tts:qwen3_tts_non_streaming_mode': 'true', 'platform:num_pipelines': '2' },
  'node-a02': { 'vad:smart_turn': 'true', 'platform:log_transcripts': 'true' },
  'node-b01': { 'vad:min_silence_ms': '600', 'llm:responses_api_reasoning_effort': 'low', 'tts:qwen3_tts_dtype': 'float32' },
  'node-c01': { 'stt:qwen3_asr_device': 'cpu', 'tts:qwen3_tts_backend': 'ggml', 'llm:chat_size': '4' },
  'node-d01': {},
};

/* flat row index: ENTRIES = [{g, sub, row}], looked up by "group:param" */
const ENTRIES = [];
CATALOG.forEach((g) => g.subs.forEach((sub) => sub.items.forEach((row) => ENTRIES.push({ g, sub, row }))));
const pk = (g, p) => g + ':' + p;
const findEntry = (key) => ENTRIES.find((e) => pk(e.g.g, e.row.p) === key);
const expectedOf = (row) => (row.pv !== undefined ? row.pv : row.d);
const actualOf = (mid, row, g) => {
  const m = machineById(mid);
  if (m.state === 'bad') return null;
  const d = DRIFT[m.id] || {};
  const k = pk(g, row.p);
  return Object.prototype.hasOwnProperty.call(d, k) ? d[k] : expectedOf(row);
};
const isDrift = (mid, row, g) => {
  const a = actualOf(mid, row, g);
  return a !== null && String(a) !== String(expectedOf(row));
};
const driftForMachine = (mid) => ENTRIES.filter((e) => isDrift(mid, e.row, e.g.g)).length;
const driftCount = () => clusterMachines().reduce((n, m) => n + driftForMachine(m.id), 0);
const paramTotal = () => ENTRIES.length;
const groupTotal = (g) => g.subs.reduce((n, s) => n + s.items.length, 0);
const opsTotal = () => ENTRIES.filter((e) => e.row.exp === 'ops').length;
const isHot = (row) => row.ef === 'hot' || (row.ef === 'both' && row.h);
const hotTotal = () => ENTRIES.filter((e) => isHot(e.row)).length;

  { k: 'edge', note: { en: 'One small box, tight VRAM. Concurrency is decided by the num_pipelines formula before anything else (playbook S1/S2, catalog §6.1).',

const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const clusterMachines = () => MACHINES.filter((m) => m.cluster === state.cluster);
const clusterInstances = () => INSTANCES.filter((i) => {
  const m = MACHINES.find((x) => x.id === i.node);
  return !!m && m.cluster === state.cluster;
});
const onlineMachines = () => clusterMachines().filter((m) => m.state === 'ok' || m.state === 'warn').length;
const activeSessions = () => sum(clusterInstances(), (i) => i.inUse);
const totalErrors = () => sum(clusterInstances(), (i) => i.err);
const machineById = (id) => MACHINES.find((m) => m.id === id && m.cluster === state.cluster) || clusterMachines()[0] || MACHINES[0];
/* ── services / VRAM / tokens ── */
const clusterServices = () => SERVICES.filter((s) => {
  const m = MACHINES.find((x) => x.id === s.node);
  return !!m && m.cluster === state.cluster;
});
const servicesOf = (id) => SERVICES.filter((s) => s.node === id);
const instancesOf = (id) => INSTANCES.filter((i) => i.node === id);
const capOf = (m) => { const g = /(\d+(?:\.\d+)?)\s*G/i.exec(m.gpu || ''); return g ? parseFloat(g[1]) : 48; };
/* pipeline occupancy follows its instance count; a service whose host is unreachable reports nothing, so it holds 0 */
const svcVram = (s) => (s.state === 'bad' ? 0 : s.kind === 'pipeline' ? instancesOf(s.node).length * TK_PIPE_VRAM : (s.vram || 0));
const vramUsed = (m) => sum(servicesOf(m.id), svcVram);
const wlKinds = (id) => servicesOf(id).map((s) => s.kind);
const tkWin = () => TK_WINDOWS.find((w) => w.k === state.tkWin) || TK_WINDOWS[1];
const tkOfInstance = (i) => i.rpm * (i.tkr || 0);
const tkCluster = () => sum(clusterInstances(), tkOfInstance);
const tkOfMachine = (id) => sum(clusterInstances().filter((i) => i.node === id), tkOfInstance);
const tkPrompt = (tk) => Math.round(tk * TK_SPLIT);
const tkCompletion = (tk) => tk - tkPrompt(tk);
const tkCost = (tk) => tkPrompt(tk) / 1e6 * TK_PRICE.in + tkCompletion(tk) / 1e6 * TK_PRICE.out;
const tkWindowTotal = () => tkCluster() * tkWin().n;
const tkWater = () => (tkCluster() / TK_QUOTA) * 100;
const tkPerTurn = () => { const r = sum(clusterInstances(), (i) => i.rpm); return r ? Math.round(tkCluster() / r) : 0; };
const tkPerSession = () => tkPerTurn() * TK_TURNS_PER_SESSION;

function topoSVG() {
  const machines = clusterMachines();
  const H = Math.max(430, machines.length * 80 + 30);
  const lbY = Math.round(H / 2 - 38);
  const rows = machines.map((m, i) => {
    const y = 26 + i * 80;
    const its = INSTANCES.filter((n) => n.node === m.id);
    const chips = its.map((n, j) => {
      const cx = 560 + j * 132, cy = y + 16;
      const cls = n.state === 'ok' ? 'it-ok' : n.state === 'warn' ? 'it-warn' : 'it-bad';
      return '<rect class="' + cls + '" x="' + cx + '" y="' + cy + '" width="120" height="30" rx="6"/>' +
        '<text class="t-sm" x="' + (cx + 8) + '" y="' + (cy + 13) + '">' + esc(n.id) + '</text>' +
        '<text class="t-sm" x="' + (cx + 8) + '" y="' + (cy + 25) + '">' + n.inUse + '/' + n.size + ' · ' + n.rpm + ' rpm</text>';
    }).join('');
    const flows = its.filter((n) => n.inUse > 0).length ? ' edge flow' : ' edge';
    const links = its.map((n, j) =>
      '<path class="' + flows.trim() + '" d="M510 ' + (y + 32) + ' H' + (560 + j * 132) + '"></path>').join('');
    return '<g class="clickable" data-machine="' + esc(m.id) + '">' +
      '<rect class="mx-box" x="300" y="' + y + '" width="200" height="64" rx="8"/>' +
      '<text class="t-md" x="314" y="' + (y + 24) + '">' + esc(m.id) + '</text>' +
      '<text class="t-sm" x="314" y="' + (y + 42) + '">' + esc(t('role.' + m.role)) + ' · ' + esc(m.ver) + ' · ' + m.util + '%</text>' +
      '<circle cx="' + (m.id ? 486 : 486) + '" cy="' + (y + 20) + '" r="4" fill="' +
      (m.state === 'ok' ? 'var(--success)' : m.state === 'warn' ? 'var(--warning)' : m.state === 'draining' ? 'var(--orange)' : 'var(--danger)') + '"/>' +
      links + chips + '</g>';
  }).join('');
  const edges = machines.map((m, i) =>
    '<path class="edge flow" d="M220 ' + (lbY + 38) + ' C260 ' + (lbY + 38) + ' 260 ' + (26 + i * 80 + 32) + ' 300 ' + (26 + i * 80 + 32) + '"></path>').join('');
  return '<svg class="topo" viewBox="0 0 980 ' + H + '" role="img" aria-label="cluster topology">' +
    '<rect class="lb-box" x="40" y="' + lbY + '" width="180" height="76" rx="10"/>' +

function tokenTrendSVG() {
  const pts = TK_TREND.concat([tkCluster()]);
  const W = 960, H = 170, padL = 62, padR = 20, padT = 18, padB = 26;
  const hi = Math.max(1, Math.ceil(Math.max.apply(null, pts) / 20000) * 20000);
  const lo = Math.max(0, Math.floor(Math.min.apply(null, pts) / 20000) * 20000);
  const span = Math.max(1, hi - lo);
  const x = (i) => padL + i * (W - padL - padR) / (pts.length - 1);
  const y = (v) => padT + (1 - (v - lo) / span) * (H - padT - padB);
  const line = pts.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const area = 'M' + x(0).toFixed(1) + ',' + (H - padB) + ' L' + line.split(' ').join(' L') +
    ' L' + x(pts.length - 1).toFixed(1) + ',' + (H - padB) + ' Z';
  const peak = Math.max.apply(null, pts), peakIdx = pts.indexOf(peak), last = pts[pts.length - 1];
  const grid = [0, 1, 2, 3].map((g) => {
    const v = lo + span * g / 3, gy = y(v);
    return '<line class="grid-line" x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + gy.toFixed(1) + '"></line>' +
      '<text class="t-sm" x="' + (padL - 8) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end">' + fmtTok(v) + '</text>';
  }).join('');
  return '<svg class="trend" data-points="' + pts.length + '" data-last="' + Math.round(last) +
    '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="tokens per minute trend">' + grid +
    '<path class="area" d="' + area + '"></path>' +
    '<polyline class="line" points="' + line + '"></polyline>' +
    '<circle class="now-dot" cx="' + x(peakIdx).toFixed(1) + '" cy="' + y(peak).toFixed(1) + '" r="3"></circle>' +
    '<text class="t-sm" x="' + (x(peakIdx) - 7).toFixed(1) + '" y="' + (y(peak) - 7).toFixed(1) + '" text-anchor="end">' +
    esc(t('tk.trend.peak')) + ' ' + fmtInt(peak) + '</text>' +
    '<circle class="now-dot" cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(last).toFixed(1) + '" r="4"></circle>' +
    '<text class="t-md" x="' + (W - padR) + '" y="' + (H - 5) + '" text-anchor="end">' +
    esc(t('tk.trend.now')) + ' ' + fmtInt(last) + '</text></svg>';
}

const sceneByKey = (k) => SCENES.find((s) => s.k === k) || null;
const draftOf = (mid) => state.draft[mid] || {};
const isHotRow = (row) => isHot(row);
const gapKeyFor = (row) => (isHotRow(row) ? 'scene.gap.hot' : row.ef === 'container' ? 'scene.gap.container' : row.ef === 'fixed' ? 'scene.gap.same' : 'scene.gap.restart');
const gapBadgeCls = (row) => (isHotRow(row) ? 'hot' : row.ef === 'container' ? 'container' : 'start');
const recTone = (row) => (isHotRow(row) ? 'hot' : row.ef === 'container' ? 'container' : 'restart');

function effBadges(row) {
  if (row.ef === 'both') return '<span class="badge start">' + esc(t('ef.start')) + '</span> <span class="badge hot">' + esc(t('ef.hot')) + '</span>';
  return '<span class="badge ' + row.ef + '">' + esc(t('ef.' + row.ef)) + '</span>';

function paramHead() {
  const th = (cls, key) => '<th class="' + cls + '">' + esc(t(key)) + '</th>';
  return '<thead><tr>' + th('c-param', 'deploy.col.param') + th('c-def', 'deploy.col.default') +

    th('c-imp', 'deploy.col.impact') + th('c-exp2', 'deploy.col.actual') + th('c-exp2', 'deploy.col.expect') +

/* 四个由音色库决定实际值的参数行：当前实际值始终是一个选项，保证还原与漂移判定不变 */
const vcShort = (s) => (String(s).length > 40 ? String(s).slice(0, 40) + '…' : String(s));
function voicePick(kind) {
  const out = [];
  if (kind === 'speaker') {
    out.push({ v: 'Aiden', label: 'Aiden · ' + t('deploy.voice.backend.default') });
    VOICES.filter(vcPickReady).forEach((x) => out.push({ v: x.id, label: x.id + ' · ' + t('src.' + (x.src || 'builtin')) }));
  } else if (kind === 'spk' || kind === 'rvq') {
    out.push({ v: 'None', label: 'None' });
    VOICES.filter((x) => vcPickReady(x) && x.src === 'clone').forEach((x) => {
      const a = vcArtifacts(x);
      if (a) out.push({ v: a[kind], label: x.id + ' · ' + kind + '.npy' });
    });
  } else {
    out.push({ v: 'None', label: 'None' });
    VOICES.filter((x) => vcPickReady(x) && x.art && x.art.instruct).forEach((x) => {
      const s = bi(x.art.instruct);
      out.push({ v: s, label: vcShort(s) + ' · ' + x.id });
    });
  }
  const seen = {};
  return out.filter((o) => (o.v in seen ? false : (seen[o.v] = 1)));
}
function vcOptions(act, list) {
  const byVal = {};
  list.forEach((o) => { byVal[o.v] = o.label; });
  const vals = [act].concat(list.map((o) => o.v)).filter((x, i, arr) => arr.indexOf(x) === i);
  return vals.map((val) => '<option value="' + escq(val) + '"' + (val === act ? ' selected' : '') + '>' +
    esc(byVal[val] || vcShort(val)) + '</option>').join('');
}

function paramRow(e, m, draft) {
  const g = e.g, row = e.row, key = pk(g.g, row.p);
  const fixed = !!g.ro || !!row.ro;
  const act = actualOf(m.id, row, g.g);
  const exp = expectedOf(row);
  const drift = act !== null && String(act) !== String(exp);
  const cls = [drift ? 'drift' : '', fixed ? 'ro' : '', row.exp === 'ops' ? 'opsrow' : '', draft[key] ? 'draft' : ''].filter(Boolean).join(' ');
  const pickKind = VC_PICK[row.p];
  const actual = act === null ? '<span style="color:var(--faint)">' + esc(t('deploy.unknown')) + '</span>'
    : fixed ? '<span class="mono">' + esc(act) + '</span>'
    : pickKind ? '<select class="pv' + (drift ? ' isdrift' : '') + '" data-orig="' + escq(act) +
        '" data-p="' + esc(row.p) + '" title="' + escq(t('deploy.pick.voice')) + '">' + vcOptions(act, voicePick(pickKind)) + '</select>'
    : '<input class="pv' + (drift ? ' isdrift' : '') + '" data-orig="' + esc(act) +
      '" data-p="' + esc(row.p) + '" value="' + esc(act) + '" aria-label="' + esc(row.p) + '">';
  const expected = '<div class="mono">' + esc(exp) + '</div><div class="dprod">' +
    esc(row.pv !== undefined ? t('deploy.prod.baseline') : t('deploy.exp.default')) + ' ' +
    (act === null ? '' : drift ? '<span class="badge diff">' + esc(t('deploy.drift.badge')) + '</span>'
      : '<span class="badge equal">' + esc(t('deploy.drift.equal')) + '</span>') + '</div>';
  const actions = fixed ? '<span style="color:var(--faint)">—</span>'
    : (draft[key] ? '<span class="badge draft">' + esc(t('deploy.draft.target')) + '</span> ' : '') +
      (drift ? '<button class="btn sm" data-push="' + esc(key) + '" data-p="' + esc(row.p) + '">' + esc(t('deploy.push.row')) + '</button>' +
        '<button class="btn sm" data-rollback="' + esc(key) + '" data-p="' + esc(row.p) + '">' + esc(t('deploy.rollback.one')) + '</button>' : '');
  return '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' +
    '<td><div class="mono">' + esc(row.p) + (row.ro ? ' <span class="badge ro">' + esc(t('deploy.const')) + '</span>' : '') + '</div>' +
    '<div class="p-what">' + esc(bi(row.w)) + '</div></td>' +
    '<td><div class="dsec">' + esc(row.d) + '</div><div class="dprod">' + esc(t('src.range') + ' ' + row.rg) + '</div></td>' +
    '<td>' + esc(srcLabel(row.src)) + '</td><td>' + effBadges(row) + '</td>' +
    '<td><span class="badge exp ' + row.exp + '">' + esc(t('exp.' + row.exp)) + '</span>' +
    (row.rk ? ' <span class="badge risk">' + esc(t('risk.' + row.rk)) + '</span>' : '') + '</td>' +
    '<td>' + esc(t('scope.' + row.s) + ' · ' + t('cost.' + row.c)) + '</td>' +
    '<td>' + actual + '</td><td>' + expected + '</td>' +
    '<td><div class="p-risk">' + esc(bi(row.x)) + '</div></td>' +
    '<td><div class="dsec">' + esc(row.a) + '</div></td><td>' + actions + '</td></tr>';
}

function groupCard(g, m) {
  const draft = draftOf(m.id);
  const rows = g.subs.map((sub) => '<tr class="shead"><td colspan="11">' + esc(t('sub.' + sub.k)) +
    ' <span class="sec">' + esc(sub.sec) + '</span></td></tr>' +

    '<div class="tscroll"><table class="tbl ptbl' + (showOps ? ' show-ops' : '') + '">' + paramHead() + '<tbody>' + rows + '</tbody></table></div>' +
    backendFold(g) + '</div>';

function recCard(m, it) {
  const e = findEntry(it.p);
  if (!e) return '';
  const row = e.row, g = e.g;
  const act = actualOf(m.id, row, g.g);
  const want = bi(it.v);
  const same = String(act === null ? expectedOf(row) : act) === String(want);
  const inDraft = draftOf(m.id)[it.p] === want;
  return '<div class="rec ' + recTone(row) + '"><div class="rec-top">' +
    '<span class="rname">' + esc(row.p) + '</span>' +
    '<span class="rsec">' + esc(t('grp.' + g.g) + ' ' + e.sub.sec) + '</span>' +
    '<span class="badge ' + gapBadgeCls(row) + '">' + esc(t(gapKeyFor(row))) + '</span>' +
    (same ? '<span class="badge equal">' + esc(t('scene.equal')) + '</span>' : '') +
    (inDraft ? '<span class="badge draft">' + esc(t('deploy.draft.target')) + '</span>' : '') +
    '<span class="rnow">' + esc(t('scene.now')) + ' ' + esc(act === null ? t('deploy.unknown') : String(act)) +
    ' → ' + esc(t('scene.suggest')) + ' ' + esc(want) + '</span></div>' +
    '<div class="rec-grid">' + ['why', 'gain', 'cost'].map((k) => '<div><div class="k">' + esc(t('scene.' + k)) +
      '</div><div class="v">' + esc(bi(it[k])) + '</div></div>').join('') + '</div>' +
    '<div class="rec-risk">' + esc(t('scene.risk')) + ' · ' + esc(bi(it.risk)) + '</div>' +
    '<div class="rec-ref">' + esc(t('scene.ref')) + ' · ' + esc(it.ref) + '</div></div>';
}

function sceneDiff(m, scene) {
  if (m.state === 'bad') return '<p class="note">' + esc(t('deploy.offline.note', { machine: m.id })) + '</p>';
  const list = scene.items.map((it) => {
    const e = findEntry(it.p);
    if (!e) return null;
    const act = actualOf(m.id, e.row, e.g.g);
    const want = bi(it.v);
    return { e, act, want, same: String(act === null ? expectedOf(e.row) : act) === String(want) };
  }).filter(Boolean);
  if (!list.some((x) => !x.same)) return '<p class="note">' + esc(t('scene.diff.empty')) + '</p>';
  return '<h3 style="margin-top:16px">' + esc(t('scene.diff.title')) + '</h3><div class="tscroll"><table class="tbl"><thead><tr><th>' +
    esc(t('deploy.col.param')) + '</th><th>' + esc(t('scene.diff.col.now')) + '</th><th>' + esc(t('scene.diff.col.want')) + '</th><th>' +
    esc(t('scene.diff.col.gap')) + '</th></tr></thead><tbody>' +
    list.map((x) => '<tr' + (x.same ? '' : ' class="drift"') + '><td class="mono">' + esc(x.e.row.p) + '</td><td class="mono">' +
      esc(x.act === null ? t('deploy.unknown') : String(x.act)) + '</td><td class="mono">' + esc(x.want) + '</td><td><span class="badge ' +
      (x.same ? 'equal' : gapBadgeCls(x.e.row)) + '">' + esc(t(x.same ? 'scene.gap.same' : gapKeyFor(x.e.row))) + '</span></td></tr>').join('') +
    '</tbody></table></div>';
}

/* ───────────────────────── conversation simulation ───────────────────────── */
function pickInstance() {
  const pool = clusterInstances().filter((i) => i.state === 'ok');
  pool.sort((a, b) => a.inUse / a.size - b.inUse / b.size);
  return pool[0];
}
function paintCall() {
  const orb = $('#orb'), st = $('#orb-state'), btn = $('#call-btn');
  if (!orb) return;
  orb.className = 'orb' + (state.orbClass ? ' ' + state.orbClass : '');
  st.textContent = t(state.orbKey || 'conv.state.idle');
  btn.textContent = t(state.calling ? 'conv.end' : 'conv.call');
  btn.className = 'btn ' + (state.calling ? '' : 'primary');
}
function addBubble(cls, text) {
  const box = $('#transcript');
  if (box.children.length === 1 && box.firstChild.classList.contains('meta') && box.firstChild.textContent === t('conv.hint')) box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function stepTalk() {
  if (state.step >= SCRIPT_LINES.length) {
    state.calling = false;
    state.orbClass = ''; state.orbKey = 'conv.state.idle';
    addBubble('meta', t('conv.stopped'));
    paintCall();
    return;
  }
  const line = SCRIPT_LINES[state.step];
  if (line.role === 'user') {
    state.orbClass = 'state-listening'; state.orbKey = 'conv.state.listening'; paintCall();
    setTimeout(() => { addBubble('user', bi(line.text)); state.step++; stepTalk(); }, 900);
  } else {
    state.orbClass = 'state-thinking'; state.orbKey = 'conv.state.thinking'; paintCall();
    setTimeout(() => {
      state.orbClass = 'state-speaking'; state.orbKey = 'conv.state.speaking'; paintCall();
      setTimeout(() => { addBubble('assistant', bi(line.text)); state.step++; stepTalk(); }, 1100);
    }, 600);
  }
}
function toggleCall() {
  if (state.calling) {
    clearTimeout(state.timer); state.calling = false; state.step = 0;
    state.orbClass = ''; state.orbKey = 'conv.state.idle';
    addBubble('meta', t('conv.stopped'));
    paintCall();
    toast(t('toast.call.end'));
    return;
  }
  state.instance = pickInstance();
  if (!state.instance) { toast(t('toast.no.instance')); return; }
  state.calling = true; state.step = 0;
  state.orbClass = 'state-listening'; state.orbKey = 'conv.state.connecting';
  renderPage();
  addBubble('meta', t('conv.meta', { node: state.instance.node }));
  addBubble('meta', t('conv.session.started'));
  paintCall();
  toast(t('toast.call.start', { node: state.instance.id }));
  state.timer = setTimeout(stepTalk, 900);
}

/* builtin 只需登记名字（跳过素材/试听/预计算），design 没有音频可裁（跳过试听） */
const vcSkip = (v, i) => (v.src === 'builtin' ? i >= 1 && i <= 3 : v.src === 'design' && i === 2);
const vcForward = (v, from) => {
  for (let i = from + 1; i < VC_STEPS.length; i++) if (!vcSkip(v, i)) return i;
  return vcLast();
};
const vcPrevStep = (v, from) => {
  for (let i = from - 1; i >= 0; i--) if (!vcSkip(v, i)) return i;
  return 0;
};

/* the step rail reuses the release pipeline component */
function vcPipe(v) {
  return '<div class="pipe">' + VC_STEPS.map((k, i) => {
    const st = i === v.step ? 'current' : (vcSkip(v, i) || i > v.step) ? 'pending' : 'done';
    return '<div class="stage ' + st + '"><div class="node">' + (st === 'done' ? '✓' : st === 'current' ? '●' : '·') +
      '</div><div class="s-label">' + esc(t(vcStepKey(i))) + '</div></div>';
  }).join('') + '</div>';
}

function vcStepSource(v) {
  const item = (k) => '<button class="vsrc' + (v.src === k ? ' on' : '') + '" data-vwsrc="' + k + '">' +
    esc(t('voice.wizard.src.' + k)) + '<small>' + esc(t('voice.wizard.src.' + k + '.sub')) + '</small></button>';
  const opt = (n) => '<option value="' + escq(n) + '"' + (v.base === n ? ' selected' : '') + '>' + esc(n) + '</option>';
  const bases = VOICES.filter((x) => vcPickReady(x) && x.src === 'builtin').map((x) => opt(x.id)).join('') + opt('Aiden');
  return '<p class="fhint">' + esc(t('voice.wizard.src.pick')) + '</p>' +
    '<div class="vsources">' + ['builtin', 'clone', 'design'].map(item).join('') + '</div>' +
    (v.src === 'builtin'
      ? '<div class="field"><label>' + esc(t('voice.wizard.base')) + '</label><select id="vw-base" class="fin">' + bases + '</select>' +
        '<div class="fhint">' + esc(t('voice.wizard.base.hint')) + '</div></div>' : '') +
    (v.src ? '<p class="fhint" style="margin-top:12px">' + esc(t('voice.wizard.link')) + '</p>' : '');
}

function vcStepAudio(v) {
  if (v.src === 'design') {
    return '<div class="field"><label>' + esc(t('voice.wizard.instruct')) + '</label>' +
      '<textarea id="vw-instruct" class="fin" rows="3">' + esc(v.instruct) + '</textarea>' +
      '<div class="fhint">' + esc(t('voice.wizard.instruct.hint')) + '</div></div>';
  }
  const loaded = v.file ? '<div class="fhint" style="color:var(--success)">' +
    esc(t('voice.wizard.audio.mocked', { name: v.file, dur: v.dur })) + '</div>' : '';
  return '<div class="field"><label>' + esc(t('voice.wizard.audio.file')) + '</label>' +
    '<input type="file" id="vw-file" class="fin" accept="audio/*">' + loaded +
    '<div class="fhint">' + esc(t('voice.wizard.audio.hint')) + '</div>' +
    '<div class="rowline" style="margin-top:8px"><button class="btn sm" data-vwrec="1">' + esc(t('voice.wizard.audio.rec')) + '</button></div></div>' +
    '<div class="field"><label>' + esc(t('voice.wizard.transcript')) + '</label>' +
    '<textarea id="vw-text" class="fin" rows="3">' + esc(v.transcript) + '</textarea>' +
    '<div class="fhint">' + esc(t('voice.wizard.transcript.hint')) + '</div></div>' +
    '<label class="cbr" style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);cursor:pointer">' +
    '<input type="checkbox" id="vw-xvec" style="width:auto;accent-color:var(--accent)"' + (v.xvec ? ' checked' : '') + '>' +
    '<span>' + esc(t('voice.wizard.xvec')) + '</span></label>';
}

/* deterministic waveform: 48 bars, the kept window highlighted */
function vcWave(v) {
  const W = 480, H = 60, n = VC_WAVE.length, slot = (W - 8) / n, total = Math.max(1, Math.round(v.dur * 1000));
  const x0 = 4 + (v.t0 / total) * (W - 8), x1 = 4 + (v.t1 / total) * (W - 8);
  return '<svg class="wave" data-bars="' + n + '" viewBox="0 0 ' + W + ' 76" role="img" aria-label="reference audio waveform">' +
    VC_WAVE.map((a, i) => {
      const cx = 4 + i * slot, mid = cx + slot / 2, h = Math.max(2, a * H);
      return '<rect class="' + (mid >= x0 && mid <= x1 ? 'bar-in' : 'bar-out') + '" x="' + cx.toFixed(1) + '" y="' +
        ((H - h) / 2 + 4).toFixed(1) + '" width="' + (slot * 0.62).toFixed(1) + '" height="' + h.toFixed(1) + '"></rect>';
    }).join('') +
    '<rect class="win" x="' + x0.toFixed(1) + '" y="2" width="' + Math.max(0, x1 - x0).toFixed(1) + '" height="72"></rect></svg>';
}
function vcStepPreview(v) {
  const total = Math.round(v.dur * 1000), keep = Math.max(0, (v.t1 - v.t0) / 1000);
  return vcWave(v) +
    '<div class="chips" style="margin:10px 0 0">' +
    '<button class="chip' + (v.t0 === 0 && v.t1 === total ? ' active' : '') + '" data-vwtrim="full">' + esc(t('voice.wizard.trim.full')) + '</button>' +
    '<button class="chip' + (v.t0 === 250 && v.t1 === total - 300 ? ' active' : '') + '" data-vwtrim="edge">' + esc(t('voice.wizard.trim.edge')) + '</button>' +
    '<span class="spacer"></span><button class="btn sm" data-vwplay="1">' + esc(t('voice.test.text')) + '</button></div>' +
    '<div class="svcgrid" style="grid-template-columns:1fr 1fr 1.4fr;margin-top:6px">' +
    '<div><div class="k">' + esc(t('voice.wizard.trim.start')) + '</div><input type="number" id="vw-t0" class="fin" min="0" max="' + total +
      '" step="50" value="' + v.t0 + '"></div>' +
    '<div><div class="k">' + esc(t('voice.wizard.trim.end')) + '</div><input type="number" id="vw-t1" class="fin" min="0" max="' + total +
      '" step="50" value="' + v.t1 + '"></div>' +
    '<div><div class="k">' + esc(t('voice.wizard.trim.keep', { n: keep.toFixed(2), d: v.dur })) + '</div>' +
    '<div class="bar" style="margin-top:8px"><i style="width:' + ((keep * 1000) / Math.max(1, total) * 100).toFixed(1) + '%"></i></div></div>' +
    '</div><p class="fhint">' + esc(t('voice.wizard.trim.hint')) + '</p>';
}

const vcPreRows = (v) => (v.src === 'design' ? ['voice.wizard.pre.design.step'] : ['voice.wizard.pre.step1', 'voice.wizard.pre.step2', 'voice.wizard.pre.step3']);
function vcRowState(v, i) {
  if (v.src === 'design') return v.pre === 'done' ? 'ok' : v.pre === 'computing' || v.pre === 'queued' ? 'running' : '';
  if (i === 0) return v.pre === 'queued' ? 'running' : (v.pre === 'computing' || v.pre === 'done' || v.pre === 'failed') ? 'ok' : '';
  if (i === 1) return v.pre === 'computing' ? 'running' : v.pre === 'done' ? 'ok' : v.pre === 'failed' ? 'fail' : '';
  return v.pre === 'done' ? 'ok' : '';
}
function vcRowStat(v, i) {
  const st = vcRowState(v, i);
  return st === 'running' ? t('test.running') : st === 'ok' ? t('test.ok') : st === 'fail' ? t('test.fail') : '';
}
function vcStepPre(v) {
  return '<div class="field"><label>' + esc(t('voice.wizard.pre.sim')) + '</label><select id="vw-sim" class="fin">' +
    '<option value="ok"' + (v.sim !== 'fail' ? ' selected' : '') + '>' + esc(t('voice.wizard.pre.sim.ok')) + '</option>' +
    '<option value="fail"' + (v.sim === 'fail' ? ' selected' : '') + '>' + esc(t('voice.wizard.pre.sim.fail')) + '</option></select>' +
    '<div class="fhint">' + esc(t('voice.wizard.pre.note', { n: VC_PRECONC, s: VC_TIMEOUT })) + '</div></div>' +
    (v.src === 'design' ? '<p class="fhint">' + esc(t('voice.wizard.pre.design.note')) + '</p>' : '') +
    '<div class="test-steps">' + vcPreRows(v).map((k, i) => {
      const st = vcRowState(v, i);
      return '<div class="tstep' + (st ? ' ' + st : '') + '" id="tstep-' + i + '"><span class="tdot"></span><span>' +
        esc(t(k, { n: VC_PRECONC })) + '</span><span class="tstat">' + esc(vcRowStat(v, i)) + '</span></div>';
    }).join('') + '</div>' +
    '<div class="bar" style="margin-top:12px"><i id="vw-bar" style="width:' + v.progress + '%"></i></div>' +
    '<div class="rowline" style="margin-top:8px"><span class="fhint">' + esc(t('voice.wizard.pre.job', { job: v.job || '—' })) +
    '</span><span class="fhint">' + esc(t('voice.wizard.pre.progress', { pct: v.progress })) + '</span><span class="spacer"></span>' +
    '<button class="btn sm" data-vwpre="1">' + esc(t(v.pre === 'failed' ? 'voice.wizard.pre.retry' : 'voice.wizard.pre.run')) + '</button></div>' +
    '<div id="vw-out">' + (v.pre === 'failed' ? '<div class="test-note-bad">' + esc(t('voice.wizard.pre.fail')) + '</div>' : '') + '</div>' +
    (v.pre === 'done' && v.artifacts ? '<dl class="kv" style="margin-top:10px"><dt>' + esc(t('voice.wizard.pre.artifacts')) +
      '</dt><dd class="mono" style="word-break:break-all">' + esc(v.artifacts.join(' · ')) + '</dd></dl>' : '');
}

function vcWrites(v) {
  if (v.src === 'clone') return [['qwen3_tts_ref_spk', VC_ART(v.ulid, 'spk.npy')], ['qwen3_tts_ref_rvq', VC_ART(v.ulid, 'rvq.npy')], ['qwen3_tts_ref_text', v.transcript]];
  if (v.src === 'design') return [['qwen3_tts_instruct', v.instruct]];
  return [['qwen3_tts_speaker', (v.name || '').trim() || v.base]];
}
function vcStepName(v) {
  const mat = v.src === 'builtin' ? v.base : v.src === 'design' ? t('voice.wizard.pre.none') : (v.file + ' · ' + v.dur + ' s');
  const trim = v.src === 'clone' ? v.t0 + ' – ' + v.t1 + ' ms' : '—';
  const arts = v.artifacts ? v.artifacts.join(' · ') : (v.src === 'builtin' ? t('voice.wizard.pre.none') : 'voice.json');
  return '<div class="field"><label>' + esc(t('voice.wizard.name')) + '</label>' +
    '<input id="vw-name" class="fin" value="' + escq(v.name) + '" placeholder="jiajia-2">' +
    '<div class="fhint">' + esc(t('voice.wizard.name.hint')) + '</div></div>' +
    '<div class="field"><label>' + esc(t('voice.wizard.summary')) + '</label><dl class="kv">' +
    '<dt>' + esc(t('voice.wizard.k.src')) + '</dt><dd>' + esc(t('src.' + v.src)) + '</dd>' +
    '<dt>' + esc(t('voice.wizard.k.backend')) + '</dt><dd class="mono">' + esc(VC_BACKEND + ' · ' + VC_MODEL) + '</dd>' +
    '<dt>' + esc(t('voice.wizard.k.audio')) + '</dt><dd class="mono" style="word-break:break-all">' + esc(mat) + '</dd>' +
    '<dt>' + esc(t('voice.wizard.k.trim')) + '</dt><dd class="mono">' + esc(trim) + '</dd>' +
    '<dt>' + esc(t('voice.wizard.k.art')) + '</dt><dd class="mono" style="word-break:break-all">' + esc(arts) + '</dd></dl></div>' +
    '<div class="field"><label>' + esc(t('voice.wizard.writes')) + '</label><dl class="kv">' +
    vcWrites(v).map((p) => '<dt class="mono">' + esc(p[0]) + '</dt><dd class="mono" style="word-break:break-all">' + esc(p[1] || '—') + '</dd>').join('') +
    '</dl><p class="fhint">' + esc(t('voice.wizard.link')) + '</p></div>';
}

function vcFooter(v) {
  const last = v.step === vcLast();
  const gated = v.step === 3 && v.pre !== 'done';
  return '<div class="ferr" id="vw-err"' + (v.err ? ' style="display:block"' : '') + '>' + esc(v.err || '') + '</div>' +
    '<div class="rowline" style="margin-top:14px">' +
    '<button class="btn" data-vwback="1"' + (v.step === 0 ? ' disabled' : '') + '>' + esc(t('voice.wizard.back')) + '</button>' +
    '<span class="spacer"></span><button class="btn" data-modal-close="1">' + esc(t('close')) + '</button>' +
    (last ? '<button class="btn primary" data-vwsave="1">' + esc(t('save')) + '</button>'
      : '<button class="btn primary" data-vwnext="1"' + (gated ? ' disabled' : '') + '>' + esc(t('voice.wizard.next')) + '</button>') + '</div>';
}
function renderVoiceWizard() {
  const v = vc();
  const body = [vcStepSource, vcStepAudio, vcStepPreview, vcStepPre, vcStepName][v.step](v);
  openModal(t('voice.wizard.title') + ' · ' + (v.step + 1) + '/' + VC_STEPS.length + ' ' + t(vcStepKey(v.step)), vcPipe(v) + body + vcFooter(v));
}
function vcCollect(v) {
  if (v.step === 0) { const b = $('#vw-base'); if (b) v.base = b.value; }
  else if (v.step === 1) {
    if (v.src === 'design') v.instruct = ($('#vw-instruct') || {}).value || '';
    else {
      v.transcript = ($('#vw-text') || {}).value || '';
      const x = $('#vw-xvec'); if (x) v.xvec = x.checked;
      const f = $('#vw-file');
      if (f && f.files && f.files[0]) { v.file = f.files[0].name; v.dur = vcDuration(v.file); }
    }
  } else if (v.step === 2) {
    v.t0 = parseInt(($('#vw-t0') || {}).value, 10); if (isNaN(v.t0)) v.t0 = 0;
    v.t1 = parseInt(($('#vw-t1') || {}).value, 10); if (isNaN(v.t1)) v.t1 = 0;
  } else if (v.step === 3) v.sim = ($('#vw-sim') || {}).value || v.sim;
  else if (v.step === 4) v.name = ($('#vw-name') || {}).value || '';
}
function vcValidate(v) {
  if (v.step === 0) return v.src ? '' : t('voice.wizard.bad.src');
  if (v.step === 1) {
    if (v.src === 'design') return v.instruct.trim().length < 8 ? t('voice.wizard.bad.instruct') : '';
    if (!v.file) return t('voice.wizard.bad.audio');
    return v.transcript.trim().length < 4 ? t('voice.wizard.bad.text') : '';
  }
  if (v.step === 2) {
    const total = Math.round(v.dur * 1000), keep = (v.t1 - v.t0) / 1000;
    return (v.t0 >= 0 && v.t0 < v.t1 && v.t1 <= total && keep >= VC_MIN_KEEP) ? '' : t('voice.wizard.bad.trim', { max: total, min: VC_MIN_KEEP });
  }
  if (v.step === 3) return v.pre === 'done' ? '' : t('voice.wizard.bad.pre');
  return '';
}
function vcEnter(v, next) {
  v.step = next;
  if (next === 2 && !v.t1) { v.t0 = 0; v.t1 = Math.round(v.dur * 1000); }
  if (next === 3) { v.job = vcJob((v.file || v.src) + '|' + (v.transcript || v.instruct || '')); v.pre = 'idle'; v.progress = 0; }
  if (next === 4 && !v.name) v.name = '';
}
function vcNext() {
  const v = vc();
  vcCollect(v);
  v.err = vcValidate(v);
  if (v.err) return renderVoiceWizard();
  vcEnter(v, vcForward(v, v.step));
  renderVoiceWizard();
}
function vcBack() {
  const v = vc();
  vcCollect(v);
  v.err = '';
  v.step = vcPrevStep(v, v.step);
  renderVoiceWizard();
}
/* staged animation: rows are touched in place, one final re-render settles the state */
function vcRunPre() {
  const v = vc();
  vcCollect(v);
  const design = v.src === 'design';
  const setRow = (i, cls, txt) => { const el = $('#tstep-' + i); if (!el) return; el.className = 'tstep' + (cls ? ' ' + cls : ''); el.querySelector('.tstat').textContent = txt; };
  const setBar = (p) => { v.progress = p; const b = $('#vw-bar'); if (b) b.style.width = p + '%'; };
  v.pre = 'queued'; v.err = '';
  setBar(8); setRow(0, 'running', t('test.running'));
  mTimer(() => {
    setRow(0, 'ok', t('test.ok'));
    if (design) { v.pre = 'computing'; setRow(0, 'running', t('test.running')); setBar(60); mTimer(() => { vcFinishPre(); renderVoiceWizard(); }, 700); return; }
    v.pre = 'computing'; setRow(1, 'running', t('test.running')); setBar(34);
    mTimer(() => {
      if (v.sim === 'fail') { v.pre = 'failed'; setRow(1, 'fail', t('test.fail')); setBar(72); audit('voice', 'act.voice.precompute.fail', v.file || v.job, 'bad'); toast(t('voice.wizard.pre.fail')); }
      else vcFinishPre();
      renderVoiceWizard();
    }, 900);
  }, 700);
}
function vcFinishPre() {
  const v = vc();
  v.ulid = vcUlid((v.file || v.src) + '|' + (v.transcript || v.instruct || ''));
  v.artifacts = v.src === 'clone'
    ? [VC_ART(v.ulid, 'spk.npy'), VC_ART(v.ulid, 'rvq.npy'), VC_ART(v.ulid, 'ref.wav')]
    : ['voice.json'];
  v.pre = 'done'; v.progress = 100;
}
function vcSave() {
  const v = vc();
  vcCollect(v);
  const name = (v.name || '').trim();
  if (!name) { v.err = t('form.required') + ' · ' + t('voice.wizard.name'); return renderVoiceWizard(); }
  if (!VC_NAME.test(name)) { v.err = t('form.bad.id'); return renderVoiceWizard(); }
  if (VOICES.some((x) => x.id.toLowerCase() === name.toLowerCase())) { v.err = t('voice.name.taken'); return renderVoiceWizard(); }
  if (v.src !== 'builtin' && v.pre !== 'done') { v.err = t('voice.wizard.bad.pre'); return renderVoiceWizard(); }
  const entry = { id: name, backend: VC_BACKEND, model: VC_MODEL, status: 'ready', usage: 0, src: v.src, created: nowStamp() };
  entry.lang = v.src === 'clone'
    ? { en: 'From reference audio', zh: '取自参考音频' }
    : { en: 'Chinese + English', zh: '中文 + 英文' };
  if (v.src === 'clone') { entry.dur = v.dur; entry.trim = { t0: v.t0, t1: v.t1 }; entry.xvec = v.xvec; entry.art = { ulid: v.ulid, refText: { en: v.transcript, zh: v.transcript } }; }
  else if (v.src === 'design') entry.art = { ulid: v.ulid, instruct: { en: v.instruct, zh: v.instruct } };
  else entry.art = { base: v.base };
  VOICES.push(entry);
  audit('voice', 'act.voice.create', name);
  state.voice = null;
  closeModal(); renderChrome(); renderPage();
  toast(t('toast.voice.create', { name }));
}

/* ───────────────────────── actions ───────────────────────── */
function handleAct(act, id) {
  const name = id || '';
  if (act === 'voice.new') return openVoiceWizard();
  if ((act === 'voice.delete' && !confirm(t('voice.delete.confirm', { name }))) ||
      (act === 'release.rollback' && !confirm(t('release.rollback.confirm')))) return;
  const map = {
    drain: t('toast.drain', { name }), resume: t('toast.resume', { name }), reboot: t('toast.reboot', { name }),
    recover: t('toast.recover', { name }), push: t('toast.push', { name }), rollback: t('toast.rollback', { name }),
    'voice.import': t('toast.voice.import'), 'voice.clone': t('toast.voice.clone', { name }),
    'voice.test': t('toast.voice.test', { name }), 'voice.delete': t('toast.voice.delete', { name }),
    'release.new': t('toast.release.new'), 'release.rollback': t('toast.release.rollback'),
    'audit.export': t('toast.audit.export'), replay: t('toast.hist.replay'),
  };
  if (map[act]) toast(map[act]);
}

/* ───────────────────────── language switch ───────────────────────── */
function setLang(next) {
  lang = next === 'zh' ? 'zh' : 'en';
  localStorage.setItem(LS_KEY, lang);
  closeOverlay();
  applyRoute();
  toast(t('toast.lang'));
}

/* ───────────────────────── events ───────────────────────── */
document.addEventListener('click', (e) => {
  const el = e.target;
  if (el.closest('#lang-btn')) return setLang(lang === 'en' ? 'zh' : 'en');
  if (el.closest('#overlay') || el.closest('[data-close]')) return closeOverlay();
  const nav = el.closest('[data-page]');
  if (nav) { location.hash = '#/' + nav.dataset.page; return; }
  const ov = el.closest('[data-overlay]');
  if (ov) return openOverlay(ov.dataset.overlay);
  const topo = el.closest('[data-machine]');
  if (topo) { state.machine = topo.dataset.machine; location.hash = '#/deploy'; return; }
  const pick = el.closest('[data-machine-pick]');
  if (pick) { state.machine = pick.dataset.machinePick; renderPage(); return; }
  const scene = el.closest('[data-scene]');
  if (scene) { state.scene = scene.dataset.scene; state.diffOn = false; renderPage(); return; }
  const ops = el.closest('[data-ops]');
  if (ops) { const ok = ops.dataset.ops; state.opsOn[ok] = !state.opsOn[ok]; renderPage(); return; }
  const diff = el.closest('[data-diff]');
  if (diff) { state.diffOn = !state.diffOn; renderPage(); return; }
  if (el.closest('[data-apply]')) return applySceneDraft();
  const clearDraft = el.closest('[data-clear-draft]');
  if (clearDraft) { delete state.draft[state.machine]; renderPage(); return toast(t('toast.scene.clear')); }
  const pushRow = el.closest('[data-push]');
  if (pushRow) return toast(t('toast.push.one', { p: pushRow.dataset.p, machine: state.machine }));
  const rollbackRow = el.closest('[data-rollback]');
  if (rollbackRow) return toast(t('toast.rollback.one', { p: rollbackRow.dataset.p, machine: state.machine }));
  const grp = el.closest('[data-group]');
  if (grp) { state.group = grp.dataset.group; renderPage(); return; }
  const cat = el.closest('[data-cat]');
  if (cat) { state.cat = cat.dataset.cat; renderPage(); return; }
  if (el.id === 'modal-overlay' || el.closest('[data-modal-close]')) return closeModal();
  const csw = el.closest('[data-cluster-switch]');
  if (csw) return switchCluster(csw.dataset.clusterSwitch);
  if (el.closest('[data-cluster-add]')) return openClusterForm(null);
  const ced = el.closest('[data-cluster-edit]');
  if (ced) return openClusterForm(ced.dataset.clusterEdit);
  const cdl = el.closest('[data-cluster-del]');
  if (cdl) return deleteCluster(cdl.dataset.clusterDel);
  if (el.closest('[data-csave]')) return saveClusterForm();
  if (el.closest('[data-madd]')) return openMachineForm(null);
  if (el.closest('[data-mauto]')) return simulateAutoRegister();
  if (el.closest('[data-mtest]')) return startMachineTest();
  if (el.closest('[data-mback]')) return openMachineForm(pendingAdd);
  const msave = el.closest('[data-msave]');
  if (msave) return saveMachineEdit(msave.dataset.msave);
  const mdel = el.closest('[data-mdel]');
  if (mdel) return deleteMachine(mdel.dataset.mdel);
  const tkwin = el.closest('[data-tkwin]');
  if (tkwin) { state.tkWin = tkwin.dataset.tkwin; renderPage(); return; }
  const msvc = el.closest('[data-msvc]');
  if (msvc) { const mid = msvc.dataset.msvc; state.svcOpen[mid] = !state.svcOpen[mid]; renderPage(); return; }
  const med = el.closest('[data-medit]');
  if (med) return openMachineEdit(med.dataset.medit);
  const shp = el.closest('[data-svc-hp]');
  if (shp) return toast(t('wl.svc.hp.mock', { name: shp.dataset.svcHp }));
  const vwsrc = el.closest('[data-vwsrc]');
  if (vwsrc) { const vw = vc(); vw.src = vwsrc.dataset.vwsrc; vw.err = ''; vw.pre = 'idle'; renderVoiceWizard(); return; }
  if (el.closest('[data-vwrec]')) {
    const vw = vc(); vcCollect(vw);
    vw.file = 'recording-6s4.wav'; vw.dur = 6.4; vw.t0 = 0; vw.t1 = 6400; vw.pre = 'idle';
    renderVoiceWizard(); return;
  }
  const vwtrim = el.closest('[data-vwtrim]');
  if (vwtrim) {
    const vw = vc(); vcCollect(vw);
    const total = Math.round(vw.dur * 1000);
    if (vwtrim.dataset.vwtrim === 'full') { vw.t0 = 0; vw.t1 = total; } else { vw.t0 = 250; vw.t1 = Math.max(0, total - 300); }
    renderVoiceWizard(); return;
  }
  if (el.closest('[data-vwplay]')) { const vw = vc(); vcCollect(vw); return toast(t('toast.voice.test', { name: vw.file || vw.name || 'sample' })); }
  if (el.closest('[data-vwpre]')) return vcRunPre();
  if (el.closest('[data-vwnext]')) return vcNext();
  if (el.closest('[data-vwback]')) return vcBack();
  if (el.closest('[data-vwsave]')) return vcSave();
  const dep = el.closest('[data-goto-deploy]');
  if (dep && !el.closest('[data-act]')) { state.machine = dep.dataset.gotoDeploy; location.hash = '#/deploy'; return; }
  const tool = el.closest('[data-tool]');
  if (tool) {
    const t0 = TOOLS[+tool.dataset.tool];
    t0.on = !t0.on;
    tool.classList.toggle('on', t0.on);
    toast(t('toast.tool', { name: t(t0.key), state: t(t0.on ? 'on' : 'off') }));
    return;
  }
  const act = el.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'call') return toggleCall();
    return handleAct(act.dataset.act, act.dataset.id);
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'set-lang') return setLang(e.target.value);
  const cb = e.target.closest && e.target.closest('.svc-on');
  if (cb) {
    const grp = document.getElementById(cb.getAttribute('data-svc-fields'));
    if (grp) grp.style.display = cb.checked ? '' : 'none';
    return;
  }
  if (e.target.id === 'cluster-select') {
    switchCluster(e.target.value);
    return;
  }
  const pv = e.target.closest && e.target.closest('.pv');
  if (pv) { pv.value = pv.dataset.orig; return toast(t('toast.param.mock', { p: pv.dataset.p })); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'm-search') {
    state.mq = e.target.value;
    const tb = $('#m-tbody');
    if (tb) tb.innerHTML = machineRows();
  }
});

window.addEventListener('hashchange', applyRoute);
applyRoute();
</script>
</body>
</html>
