# Alembic config for the console database. The URL is injected by alembic/env.py
# from app.config.database so that the image, tests and CLI all agree on one
# source of truth (spec §10.1).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =
# Keep migration files explicitly named (0001_initial, 0002_...) so review diffs
# stay readable instead of containing random hex revision ids.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
