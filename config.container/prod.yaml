# Generated by the deployment parameter platform.
# Edit through the console: a manual change is overwritten on the next
# publish and will not appear in the version history.
schema_version: 1
blocks:
  vad:
    kind: vad
    backend: silero
    settings:
      min_silence_ms: 300
      smart_turn: false
      smart_turn_model_path: cache/smart-turn-v3.2-cpu.onnx
      speculative_reopen_ms: 0
      unanswered_reopen_ms: 0
  stt:
    kind: stt
    backend: sense-voice
    settings:
      sense_voice_stt_model_name: {env: S2S_SENSEVOICE_MODEL_DIR}
      sense_voice_stt_device: cuda
      sense_voice_stt_language: zh
  llm:
    kind: llm
    backend: chat-completions
    settings:
      model_name: {env: GPUSTACK_MODEL}
      responses_api_base_url: {env: GPUSTACK_BASE_URL}
      responses_api_api_key: {env: GPUSTACK_API_KEY}
      responses_api_stream: true
      responses_api_reasoning_effort: ''
      stream_batch_sentences: 1
      init_chat_role: system
      init_chat_prompt: 你是一个语音助手。请始终用中文回答，回复要简短：一两句话即可，除非用户要求展开细节。
      enable_lang_prompt: true
  tts:
    kind: tts
    backend: qwen3
    settings:
      qwen3_tts_model_name: {env: S2S_TTS_MODEL_DIR}
      qwen3_tts_backend: torch
      qwen3_tts_device: cuda
      qwen3_tts_language: auto
      qwen3_tts_non_streaming_mode: false
      qwen3_tts_streaming_chunk_size: 4
pipelines:
  prod:
    stages:
      vad: vad
      stt: stt
      llm: llm
      tts: tts
    num_pipelines: 1
    options:
      enable_live_transcription: false
      enable_visemes: false
      stv_model_name: {env: S2S_STV_MODEL_DIR}
      stv_device: cpu
runtime:
  server:
    host: 0.0.0.0
    port: 8765
