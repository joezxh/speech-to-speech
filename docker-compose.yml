---
services:

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - /root/.cache/qwen35-4b/Qwen3.5-4B-Q4_K_M.gguf
      - -np
      - "1"
      - -c
      - "8192"
      - -fa
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - 8080:8080/tcp
    volumes:
      - ./cache/:/root/.cache/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  pipeline:
    # 端侧 LLM（llama）已停用，仅用云端 LLM（GPUStack）；如需回退端侧，
    # 取消注释 depends_on 并 `docker compose up -d llama`
    # depends_on:
    #   llama:
    #     condition: service_healthy
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    # No `command` on purpose: it would override the image ENTRYPOINT, and
    # supervisord would never start. What runs is decided by supervisord.conf:
    # console on :8000, pipeline on loopback :8765.
    # 环境变量整体交给参数平台渲染的 prod.env。任何一项若同时写在
    # environment 下，会以更高优先级覆盖它（Compose: environment > env_file），
    # 平台就再也改不动那个值了。
    env_file:
      - ./config/prod.env
    ports:
      - "8000:8000"          # the only published port (spec §13.4)
    expose:
      - 8765/tcp            # loopback only: never published
    volumes:
      - ./cache/:/root/.cache/
      - ../.silero-dl2/silero-vad-master:/opt/silero-vad:ro
      # console is the only writer of /app/config; pipeline only reads it.
      - ./config:/app/config
      - ./data:/app/data
      - ./docs/parameter-catalog.yaml:/app/catalog/parameter-catalog.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
