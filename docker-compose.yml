---
services:

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - /root/.cache/qwen35-4b/Qwen3.5-4B-Q4_K_M.gguf
      - -np
      - "1"
      - -c
      - "8192"
      - -fa
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - 8080:8080/tcp
    volumes:
      - ./cache/:/root/.cache/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  pipeline:
    # 端侧 LLM（llama）已停用，仅用云端 LLM（GPUStack）；如需回退端侧，
    # 取消注释 depends_on 并 `docker compose up -d llama`
    # depends_on:
    #   llama:
    #     condition: service_healthy
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    # 配置全部来自 /app/config/prod.yaml。文件模式只接受 -f 与 --name
    # （cli.py:_run_file_command），因此其余开关只能写进 YAML——这就是这里
    # 从四十多项缩到六项的原因。
    command:
      - speech-to-speech
      - serve
      - -f
      - /app/config/prod.yaml
      - --name
      - prod
    # 环境变量整体交给参数平台渲染的 prod.env。任何一项若同时写在
    # environment 下，会以更高优先级覆盖它（Compose: environment > env_file），
    # 平台就再也改不动那个值了。
    env_file:
      - ./config/prod.env
    expose:
      - 8765/tcp
    ports:
      - 8765:8765/tcp
    volumes:
      - ./cache/:/root/.cache/
      - ../.silero-dl2/silero-vad-master:/opt/silero-vad:ro
      # 参数平台写这里；:ro 保证容器不能回写，配置只有一个写入方。
      - ./config:/app/config:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
