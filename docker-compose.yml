---
services:

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - /root/.cache/qwen35-4b/Qwen3.5-4B-Q4_K_M.gguf
      - -np
      - "1"
      - -c
      - "8192"
      - -fa
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - 8080:8080/tcp
    volumes:
      - ./cache/:/root/.cache/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  pipeline:
    # 端侧 LLM（llama）已停用，仅用云端 LLM（GPUStack）；如需回退端侧，
    # 取消注释 depends_on 并 `docker compose up -d llama`
    # depends_on:
    #   llama:
    #     condition: service_healthy
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    command:
      - speech-to-speech
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      # —— LLM:GPUStack Qwen3-8B（OpenAI 兼容；chat-completions 后端，与本地 pipeline 一致）——
      - --llm_backend
      - chat-completions
      - --model_name
      - "${GPUSTACK_MODEL:-Qwen3-8B}"
      - --responses_api_base_url
      - "${GPUSTACK_BASE_URL:-http://192.168.40.30/v1-openai}"
      - --responses_api_api_key
      - "${GPUSTACK_API_KEY:-not-needed}"
      - --responses_api_stream
      - --responses_api_reasoning_effort
      - ""
      - --stream_batch_sentences
      - "1"
      # —— STT:Qwen3-ASR（本地 ./cache/qwen3-asr-model-hf，与本地 pipeline 一致）——
      - --stt
      - qwen3-asr
      - --qwen3_asr_model_name
      - /root/.cache/qwen3-asr-model-hf
      - --qwen3_asr_device
      - auto
      - --qwen3_asr_language
      - auto
      # —— TTS:Qwen3-TTS（torch / cuda / 句内流式，与本地 pipeline 一致）——
      - --tts
      - qwen3
      - --qwen3_tts_model_name
      - /root/.cache/qwen3-tts-model
      - --qwen3_tts_backend
      - torch
      - --qwen3_tts_device
      - cuda
      - --qwen3_tts_non_streaming_mode
      - "False"
      - --qwen3_tts_streaming_chunk_size
      - "4"
      # —— VAD 判停：关闭 Smart Turn，纯静音判停（与本地 pipeline 一致）——
      - --min_silence_ms
      - "700"
      - --no_smart_turn
      - --speculative_reopen_ms
      - "0"
      - --unanswered_reopen_ms
      - "0"
      - --init_chat_role
      - system
      - --init_chat_prompt
      - "You are a helpful voice assistant. Keep every reply very short: one or two spoken sentences unless the user asks for detail. Reply in the user's language."
      - --no_enable_live_transcription
      - --smart_turn_model_path
      - /root/.cache/smart-turn-v3.2-cpu.onnx
    environment:
      # 容器内 HuggingFace 出口不稳（SSL EOF），而模型权重/配置已完整缓存
      # 在本地 ./cache。离线模式避免启动时对 processor_config.json 等「本就
      # 不存在」的可选文件反复联网 HEAD 重试，导致 pipeline 卡死在加载阶段。
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TOKENIZERS_PARALLELISM=false
    expose:
      - 8765/tcp
    ports:
      - 8765:8765/tcp
    volumes:
      - ./cache/:/root/.cache/
      - ../.silero-dl2/silero-vad-master:/opt/silero-vad:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
