---
services:

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - /root/.cache/qwen35-4b/Qwen3.5-4B-Q4_K_M.gguf
      - -np
      - "1"
      - -c
      - "8192"
      - -fa
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - 8080:8080/tcp
    volumes:
      - ./cache/:/root/.cache/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  pipeline:
    # 端侧 LLM（llama）已停用，仅用云端 LLM（GPUStack）；如需回退端侧，
    # 取消注释 depends_on 并 `docker compose up -d llama`
    # depends_on:
    #   llama:
    #     condition: service_healthy
    # Every release is this one tag. Rolling back is
    # `S2S_IMAGE_TAG=<old> docker compose up -d --no-build`: console and
    # pipeline move together because they share the image (spec §12 R21).
    image: s2s:${S2S_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    # No `command` on purpose: it would override the image ENTRYPOINT, and
    # supervisord would never start. What runs is decided by supervisord.conf:
    # console on :8000, pipeline on loopback :8765.
    # 环境变量整体交给参数平台渲染的 prod.env。任何一项若同时写在
    # environment 下，会以更高优先级覆盖它（Compose: environment > env_file），
    # 平台就再也改不动那个值了。
    env_file:
      - ./config/prod.env
    ports:
      - "8000:8000"          # console (spec §13.4)
      # ── 暴露 ASR / TTS 模型（OpenAI 兼容 REST 端点，均在 pipeline :8765）──
      #   ASR: POST /v1/audio/transcriptions   (STT 模型由 ./config/prod.env 决定)
      #   TTS: POST /v1/audio/speech           (TTS 模型由 ./config/prod.env 决定)
      #   已固化进镜像：构建期由 Dockerfile.ttsfix 应用 scripts/patch_pipeline_rest.py 注入，
      #   无需运行时手动打补丁，容器重建/镜像重做后 ASR/TTS 接口依然存在。
      - "8765:8765/tcp"
    expose:
      - 8765/tcp            # loopback 别名（保留旧语义）
    volumes:
      - ./cache/:/root/.cache/
      - ../.silero-dl2/silero-vad-master:/opt/silero-vad:ro
      # console is the only writer of /app/config; pipeline only reads it.
      - ./config:/app/config
      - ./data:/app/data
      - ./docs/parameter-catalog.yaml:/app/catalog/parameter-catalog.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
