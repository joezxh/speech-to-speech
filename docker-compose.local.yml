# 本地 split 形态部署（Windows 宿主机 + Docker Desktop）：pipeline:8765 + console:8010，GPU0。
#
# 与 40.30 的 deploy/4030/docker-compose.split.yml 的差异（每条都有依据）：
#   1) image       : 本地构建的 s2s-agent:local / s2s-console:local（4030-1 是 40.30 上按
#                    旧代码构建的，且已被清理；本地镜像由 Dockerfile.agent 全量重建，
#                    含 voxcpm / livekit-agents / funasr 运行期依赖与构建期自检）。
#   2) device_ids  : ['0']（本机只有一张 RTX 5070 Ti Laptop 12GB；ASR+TTS+SER+diarization
#                    同卡共存，num_pipelines=1）。
#   3) config 挂载 : ./config.split.0.6b.2（第三套配置档：模型与参数逐项对齐仓库 config/prod.yaml，
#                    仅权重路径改容器路径）。
#   4) env_file    : ./config.split.0.6b.2/prod.env.local（本地口径：LLM 走百炼公网、DB 走本地
#                    Postgres、机器号 local-split2）。**compose 变量插值只读 shell env 与 .env，
#                    不读 env_file**，所以这里不写 ${JWT_SECRET_KEY} 插值，改由 env_file 直接
#                    注入容器环境变量（console 从 os.environ 读取，效果一致且不会循环重启）。
#   5) silero-vad  : 仓库外的绝对路径挂载（.silero-dl2/silero-vad-master 自带 jit 权重）。
#   6) console 端口 8010:8000；pipeline 8765:8765。
#
# 启动（仓库根）：
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml logs -f s2s-pipeline

name: s2s-local

services:
  s2s-console:
    image: s2s-console:local
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    ports:
      - "8010:8000"
    env_file:
      - config.split.2b/prod.env.local
    environment:
      PIPELINE_BASE_URL: http://s2s-pipeline:8765
      STATIC_DIR: /app/console/static
    volumes:
      - ./config.split.0.6b.2:/app/config
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  s2s-pipeline:
    image: s2s-agent:local2
    command: ["serve", "-f", "/app/config/prod.local.yaml", "--name", "prod", "--with-agent"]
    env_file:
      - config.split.2b/prod.env.local
    environment:
      S2S_AGENT_CONSOLE_URL: http://s2s-console:8000
      # 注册码：仅首次注册需要（compose 只读 shell env / .env 插值）。
      # 用法：$env:S2S_AGENT_REGISTER_CODE='<code>'; docker compose -f docker-compose.local.yml up -d --force-recreate s2s-pipeline
      # 注册成功后 token 落 ./data/agent/token，此后该变量可留空。
      S2S_AGENT_REGISTER_CODE: ${S2S_AGENT_REGISTER_CODE:-}
      # 本地机器号：不能与 40.30 的 pipeline-3030 相同（同 machine 行会互相覆盖令牌并翻转
      # 心跳状态，症状 heartbeat 401）。本地用独立库 s2s_db_local，但仍保持唯一。
      S2S_AGENT_MACHINE_ID: local-split2
      # 令牌落挂载卷（./data 已挂到 /app/data）：容器重建后无需重新注册。
      S2S_AGENT_TOKEN_FILE: /app/data/agent/token
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "8765:8765"
    volumes:
      - ./cache:/root/.cache/
      - ./cache/sensevoice-small:/usr/src/app/cache/sensevoice-small:ro
      - D:/work/qwen-audio-agent/.silero-dl2/silero-vad-master:/opt/silero-vad:ro
      - ./config.split.0.6b.2:/app/config
      - ./data:/app/data
    depends_on:
      s2s-console:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
